// ---------------------------------------------------------------- maths
const SQRT_2PI = Math.sqrt(2 * Math.PI);
const npdf = x => Math.exp(-x * x / 2) / SQRT_2PI;
// Standard normal CDF: Hart (1968) double-precision rational approximation, as in West (2005).
function ncdf(x) {
  const xa = Math.abs(x);
  let c = 0;
  if (xa <= 37) {
    const e = Math.exp(-xa * xa / 2);
    if (xa < 7.07106781186547) {
      let b = 3.52624965998911e-2 * xa + 0.700383064443688;
      b = b * xa + 6.37396220353165; b = b * xa + 33.912866078383;
      b = b * xa + 112.079291497871; b = b * xa + 221.213596169931; b = b * xa + 220.206867912376;
      c = e * b;
      b = 8.83883476483184e-2 * xa + 1.75566716318264;
      b = b * xa + 16.064177579207; b = b * xa + 86.7807322029461; b = b * xa + 296.564248779674;
      b = b * xa + 637.333633378831; b = b * xa + 793.826512519948; b = b * xa + 440.413735824752;
      c /= b;
    } else {
      let b = xa + 0.65;
      b = xa + 4 / b; b = xa + 3 / b; b = xa + 2 / b; b = xa + 1 / b;
      c = e / b / SQRT_2PI;
    }
  }
  return x > 0 ? 1 - c : c;
}
// Black-Scholes-Merton with continuous dividend yield q. p = { S, K, T, r, q, s } (decimals, s = sigma).
function bs(p) {
  const rt = Math.sqrt(p.T), sd = p.s * rt, eq = Math.exp(-p.q * p.T), er = Math.exp(-p.r * p.T);
  const d1 = (Math.log(p.S / p.K) + (p.r - p.q + p.s * p.s / 2) * p.T) / sd, d2 = d1 - sd;
  const n1 = ncdf(d1), n2 = ncdf(d2), m1 = ncdf(-d1), m2 = ncdf(-d2), pdf = npdf(d1);
  const decay = -p.S * eq * pdf * p.s / (2 * rt);
  return {
    d1, d2, n1, n2, m1, m2, pvK: p.K * er, pvS: p.S * eq,
    call: p.S * eq * n1 - p.K * er * n2, put: p.K * er * m2 - p.S * eq * m1,
    delta: { call: eq * n1, put: -eq * m1 },
    gamma: eq * pdf / (p.S * sd),
    theta: { call: decay - p.r * p.K * er * n2 + p.q * p.S * eq * n1, put: decay + p.r * p.K * er * m2 - p.q * p.S * eq * m1 },
    vega: p.S * eq * pdf * rt,
    rho: { call: p.K * p.T * er * n2, put: -p.K * p.T * er * m2 },
  };
}
const GREEKS = ["delta", "gamma", "theta", "vega", "rho"];
const greekValue = (b, g, opt) => typeof b[g] === "number" ? b[g] : b[g][opt];

// Implied volatility by bisection on [0.01%, 100%]; every step is kept for display.
const IV_LO = 1e-4, IV_HI = 1, IV_WIDTH = 1e-6;
function solveIV(p, opt, price) {
  const lower = Math.max(opt === "call" ? p.S * Math.exp(-p.q * p.T) - p.K * Math.exp(-p.r * p.T)
                                         : p.K * Math.exp(-p.r * p.T) - p.S * Math.exp(-p.q * p.T), 0);
  const upper = opt === "call" ? p.S * Math.exp(-p.q * p.T) : p.K * Math.exp(-p.r * p.T);
  const f = s => bs({ ...p, s })[opt];
  if (!(price > lower && price < upper)) return { error: "bounds", lower, upper };
  if (price <= f(IV_LO) || price >= f(IV_HI)) return { error: "range", lower, upper };
  const steps = [];
  let lo = IV_LO, hi = IV_HI;
  while (hi - lo >= IV_WIDTH) {
    const mid = (lo + hi) / 2, v = f(mid);
    steps.push({ lo, hi, mid, v });
    if (v < price) lo = mid; else hi = mid;
  }
  const sigma = steps[steps.length - 1].mid;
  return { lower, upper, steps, sigma, miss: Math.abs(f(sigma) - price) };
}

// ---------------------------------------------------------------- formatting
const fmt = (x, d = 2) => {
  const s = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  return (x < 0 && Number(s.replace(/,/g, "")) > 0 ? "−" : "") + s;
};
const pct = (x, d = 2) => fmt(100 * x, d) + "%";
const fmtT = t => String(+t.toPrecision(2));
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

const model = () => ({ S: P.S0, K: P.K, T: P.T, r: P.r / 100, q: P.q / 100, s: P.sigma / 100 });

function applyPreset(i) {

  preset = i;
  const b = bs(model());
  mkt.call = Math.round(100 * b.call) / 100;           // market prices = BS prices to the cent (10.45 in lecture 8)
  mkt.put = Math.round(100 * b.put) / 100;

}
function syncInputs() {
  for (const k of FIELDS) {
    const el = $(`f-${k}`);
    el.value = k === "mkt" ? mkt[opt] : P[k];
    el.classList.remove("bad");
  }
}
function readInputs() {
  const v = {};
  let ok = true;
  for (const k of FIELDS) {
    if ($(`w-${k}`).hidden) continue;
    const el = $(`f-${k}`), x = el.valueAsNumber, bad = !(Number.isFinite(x) && RULES[k](x));
    el.classList.toggle("bad", bad);
    ok = ok && !bad;
    v[k] = x;
  }
  return ok ? v : null;
}

// ---------------------------------------------------------------- charts
// Charts are drawn at the panel's own pixel size, so text stays 11-12 px however wide the frame is.
let W = 420, H = 260, geom = null;                       // geom: x-axis mapping of the chart, for dragging S₀
function fitCharts() {
  const chart = $("chart"), narrow = matchMedia("(max-width: 700px)").matches;
  W = Math.max(300, $("view").clientWidth - 12);
  chart.style.height = narrow ? Math.round(W * 0.8) + "px" : "";
  chart.innerHTML = "";
  H = Math.max(200, chart.clientHeight);
}
const textW = s => [...s].reduce((w, c) => w + (/[\u2e80-\u9fff\uff00-\uffef]/.test(c) ? 11.5 : 6.6), 0);
const ML = 44, MR = 14, MB = 34;
function swatch(kind, color, x, y) {
  if (kind === "box") return `<rect x="${x + 3}" y="${y - 5}" width="13" height="10" fill="${color}" opacity="0.45"/>`;
  if (kind === "dot") return `<circle cx="${x + 9}" cy="${y}" r="3.5" fill="${color}"/>`;
  return `<line x1="${x}" x2="${x + 18}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="${kind === "line" ? 2 : 1.4}"${kind === "dash" ? ' stroke-dasharray="5 4"' : ""}/>`;
}
// Title (what the y axis shows) plus a legend that wraps onto more rows in a narrow frame.
function header(title, items) {
  let g = `<text x="${ML}" y="13" font-size="12" font-weight="600" fill="#1e3a8a">${title}</text>`, lx = ML, ly = 30;
  for (const [kind, color, label] of items) {
    const w = 22 + textW(label);
    if (lx > ML && lx + w > W - 4) { lx = ML; ly += 17; }
    g += swatch(kind, color, lx, ly) + `<text x="${lx + 22}" y="${ly + 4}" font-size="11.5" fill="#334155">${label}</text>`;
    lx += w + 16;
  }
  return { g, mt: ly + 14 };
}
// Axes, grid and frame; returns the data-to-pixel maps.
function plot(o) {
  const iw = W - ML - MR, ih = H - o.mt - MB;
  const x = v => ML + iw * (v - o.xlo) / (o.xhi - o.xlo), y = v => o.mt + ih * (o.yhi - v) / (o.yhi - o.ylo);
  let g = "";
  if (o.yTicks !== false) {
    for (const t of niceTicks(o.ylo, o.yhi, Math.max(3, Math.round(ih / 45))))
      g += `<line x1="${ML}" x2="${W - MR}" y1="${y(t)}" y2="${y(t)}" stroke="${t === 0 && o.ylo < 0 ? "#94a3b8" : "#eef2f7"}"/>` +
           `<text x="${ML - 6}" y="${y(t) + 4}" text-anchor="end" fill="#64748b" font-size="11">${o.yfmt(t)}</text>`;
  }
  for (const t of niceTicks(o.xlo, o.xhi, Math.max(3, Math.round(iw / 70))))
    g += `<line x1="${x(t)}" x2="${x(t)}" y1="${o.mt + ih}" y2="${o.mt + ih + 4}" stroke="#94a3b8"/>` +
         `<text x="${x(t)}" y="${o.mt + ih + 16}" text-anchor="middle" fill="#64748b" font-size="11">${o.xfmt(t)}</text>`;
  g += `<text x="${ML + iw / 2}" y="${H - 4}" text-anchor="middle" fill="#64748b" font-size="11.5">${o.xlabel}</text>` +
       `<rect x="${ML}" y="${o.mt}" width="${iw}" height="${ih}" fill="none" stroke="#cbd5e1"/>`;
  return { x, y, iw, ih, g };
}
const line = (pts, color, width, dash = "") =>
  `<polyline points="${pts.map(([a, b]) => `${a.toFixed(1)},${b.toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="${width}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`;
const grid = (lo, hi, n) => Array.from({ length: n + 1 }, (_, i) => lo + (hi - lo) * i / n);
// Stock price range of the price and Greeks charts: 0.5K to 1.5K unless S₀ lies outside it.
function stockRange(p) {
  return [p.S < 0.5 * p.K ? 0.8 * p.S : 0.5 * p.K, p.S > 1.5 * p.K ? 1.2 * p.S : 1.5 * p.K];
}
// Vertical marker with a label that flips to the left of the line near the right edge.
function marker(x, top, bottom, color, dash, label, labelY) {
  const flip = x > W - MR - textW(label) - 10;
  return `<line x1="${x}" x2="${x}" y1="${top}" y2="${bottom}" stroke="${color}" stroke-width="1.2" stroke-dasharray="${dash}"/>` +
         `<text x="${x + (flip ? -4 : 4)}" y="${labelY}" font-size="11" fill="${color}" text-anchor="${flip ? "end" : "start"}">${label}</text>`;
}

function priceChart(p) {
  const call = opt === "call", [lo, hi] = stockRange(p);
  const intr = S => call ? Math.max(S - p.K, 0) : Math.max(p.K - S, 0), val = S => bs({ ...p, S })[opt];
  const xs = grid(lo, hi, Math.max(60, Math.round(W / 3)));
  const curve = xs.map(S => [S, val(S)]), floor = xs.map(S => [S, intr(S)]);
  const h = header(TXT.priceY, [["line", "#1e3a8a", TXT.value[opt]], ["dash", "#64748b", TXT.intrinsic],
                                ["box", "#d97706", TXT.timeValue], ["dash", "#dc2626", TXT.strike]]);
  const yhi = Math.max(...curve.map(c => c[1]), ...floor.map(c => c[1])) * 1.06;
  const a = plot({ mt: h.mt, xlo: lo, xhi: hi, ylo: 0, yhi, xlabel: TXT.priceX, xfmt: v => fmt(v, 0), yfmt: v => fmt(v, v % 1 ? 1 : 0) });
  geom = { xlo: 0.5 * p.K, xhi: 1.5 * p.K, iw: a.iw, left: ML, lo, hi };
  const px = pts => pts.map(([S, v]) => [a.x(S), a.y(v)]);
  const area = [...px(curve), ...px(floor).reverse()].map(([u, v]) => `${u.toFixed(1)},${v.toFixed(1)}`).join(" ");
  const b = bs(p), vS = b[opt], iS = intr(p.S), x0 = a.x(p.S);
  const tv = TXT.timeValue + " " + fmt(vS - iS);
  let g = a.g + `<polygon points="${area}" fill="#d97706" opacity="0.28"/>`;
  g += `<line x1="${a.x(p.K)}" x2="${a.x(p.K)}" y1="${h.mt}" y2="${h.mt + a.ih}" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  g += line(px(floor), "#64748b", 1.4, "5 4") + line(px(curve), "#1e3a8a", 2);
  g += marker(x0, h.mt, h.mt + a.ih, "#475569", "2 3", `S₀ = ${fmt(p.S)}`, h.mt + 12);
  g += `<line x1="${x0}" x2="${x0}" y1="${a.y(iS)}" y2="${a.y(vS)}" stroke="#d97706" stroke-width="4"/>` +
       `<circle cx="${x0}" cy="${a.y(vS)}" r="4" fill="#1e3a8a" stroke="#fff" stroke-width="1.2"/>` +
       `<circle cx="${x0}" cy="${a.y(iS)}" r="3.5" fill="#64748b" stroke="#fff" stroke-width="1.2"/>`;
  const flip = x0 > W - MR - textW(tv) - 14;
  g += `<text x="${x0 + (flip ? -9 : 9)}" y="${(a.y(vS) + a.y(iS)) / 2 + 4}" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="${flip ? "end" : "start"}">${tv}</text>`;
  return svg(h.g + g, TXT.tabs[0]);
}

function distChart(p) {
  const sd = p.s * Math.sqrt(p.T), m = Math.log(p.S) + (p.r - p.q - p.s * p.s / 2) * p.T, b = bs(p);
  const lo = Math.min(Math.exp(m - 3.5 * sd), 0.9 * p.K), hi = Math.max(Math.exp(m + 3.5 * sd), 1.1 * p.K);
  const dens = s => npdf((Math.log(s) - m) / sd) / (s * sd);
  const n = Math.max(80, Math.round(W / 2));
  const left = grid(lo, p.K, Math.max(2, Math.round(n * (p.K - lo) / (hi - lo)))).map(s => [s, dens(s)]);
  const right = grid(p.K, hi, Math.max(2, Math.round(n * (hi - p.K) / (hi - lo)))).map(s => [s, dens(s)]);
  const h = header(TXT.distY, [["box", "#2563eb", TXT.exercised(pct(b.n2))], ["box", "#94a3b8", TXT.lapsed(pct(b.m2))]]);
  const yhi = Math.max(...left.map(c => c[1]), ...right.map(c => c[1])) * 1.1;
  const a = plot({ mt: h.mt, xlo: lo, xhi: hi, ylo: 0, yhi, yTicks: false, xlabel: TXT.distX, xfmt: v => fmt(v, 0) });
  const px = pts => pts.map(([s, d]) => [a.x(s), a.y(d)]);
  const base = a.y(0), poly = (pts, color, op) =>
    `<polygon points="${[[pts[0][0], 0], ...pts, [pts[pts.length - 1][0], 0]].map(([s, d]) => `${a.x(s).toFixed(1)},${a.y(d).toFixed(1)}`).join(" ")}" fill="${color}" opacity="${op}"/>`;
  const mean = p.S * Math.exp((p.r - p.q) * p.T), bottom = h.mt + a.ih;
  let g = a.g + poly(left, "#94a3b8", 0.35) + poly(right, "#2563eb", 0.4) + line(px([...left, ...right]), "#1e3a8a", 2);
  g += `<line x1="${ML}" x2="${W - MR}" y1="${base}" y2="${base}" stroke="#94a3b8"/>`;
  g += marker(a.x(p.K), h.mt, bottom, "#dc2626", "5 4", `K = ${fmt(p.K)}`, h.mt + 12);
  g += marker(a.x(mean), h.mt, bottom, "#b45309", "2 3", `E[S_T] = ${fmt(mean)}`, h.mt + 27);
  return svg(h.g + g, TXT.tabs[1]);
}

function ivChart(p, res) {
  const f = s => bs({ ...p, s })[opt];
  const h = header(TXT.ivY, [["line", "#1e3a8a", TXT.ivCurve[opt]], ["dash", "#d97706", TXT.ivMkt],
                             ...(res.steps ? [["box", "#2563eb", TXT.ivBracket], ["dot", "#2563eb", TXT.ivMids]] : [])]);
  const curve = grid(0.001, IV_HI, Math.max(40, Math.round(W / 4))).map(s => [s, f(s)]);
  const target = mkt[opt], yhi = Math.max(f(IV_HI), target) * 1.08;
  const a = plot({ mt: h.mt, xlo: 0, xhi: IV_HI, ylo: 0, yhi, xlabel: TXT.ivX, xfmt: v => fmt(v * 100, 0), yfmt: v => fmt(v, v % 1 ? 1 : 0) });
  let g = a.g;
  if (res.steps) {
    const st = res.steps[Math.min(ivStep ?? res.steps.length, res.steps.length) - 1];
    g += `<rect x="${a.x(st.lo)}" y="${h.mt}" width="${Math.max(1, a.x(st.hi) - a.x(st.lo))}" height="${a.ih}" fill="#2563eb" opacity="0.14"/>`;
    g += `<line x1="${a.x(st.mid)}" x2="${a.x(st.mid)}" y1="${h.mt}" y2="${h.mt + a.ih}" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>`;
  }
  g += `<line x1="${ML}" x2="${W - MR}" y1="${a.y(target)}" y2="${a.y(target)}" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  g += line(curve.map(([s, v]) => [a.x(s), a.y(v)]), "#1e3a8a", 2);
  if (res.steps) {
    const k = Math.min(ivStep ?? res.steps.length, res.steps.length) - 1;
    res.steps.forEach((st, i) => {
      g += `<circle cx="${a.x(st.mid)}" cy="${a.y(st.v)}" r="${i === k ? 5 : 3}" fill="${i === k ? "#1e3a8a" : "#2563eb"}" stroke="#fff" stroke-width="1"/>`;
      if (i < 5) g += `<text x="${a.x(st.mid)}" y="${a.y(st.v) - 8}" font-size="11" text-anchor="middle" fill="#1e3a8a">${i + 1}</text>`;
    });
    const label = `σ = ${pct(res.sigma)}`, xs = a.x(res.sigma), flip = xs > W - MR - textW(label) - 14;
    g += `<circle cx="${xs}" cy="${a.y(target)}" r="5" fill="none" stroke="#15803d" stroke-width="2"/>` +
         `<text x="${xs + (flip ? -9 : 9)}" y="${a.y(target) + 17}" font-size="12" font-weight="600" fill="#15803d" text-anchor="${flip ? "end" : "start"}">${label}</text>`;
  }
  return svg(h.g + g, TXT.tabs[2]);
}

function greekChart(p) {
  const g0 = GREEKS[greek], [lo, hi] = stockRange(p);
  const mats = [p.T, p.T / 4, p.T / 12], colors = ["#1e3a8a", "#d97706", "#15803d"];
  const xs = grid(lo, hi, Math.max(60, Math.round(W / 3)));
  const curves = mats.map(T => xs.map(S => [S, greekValue(bs({ ...p, S, T }), g0, opt)]));
  const same = g0 === "gamma" || g0 === "vega";
  const title = TXT.greekNames[greek] + (same ? ` — ${TXT.sameBoth}` : ` — ${TXT.optName[opt]}`);
  const h = header(title, [...mats.map((T, i) => ["line", colors[i], TXT.maturity(fmtT(T))]), ["dash", "#dc2626", TXT.strike]]);
  const all = curves.flat().map(c => c[1]);
  let ylo = Math.min(0, ...all), yhi = Math.max(0, ...all);
  const pad = (yhi - ylo) * 0.06;
  if (yhi > 0) yhi += pad;
  if (ylo < 0) ylo -= pad;
  const a = plot({ mt: h.mt, xlo: lo, xhi: hi, ylo, yhi, xlabel: TXT.greekX, xfmt: v => fmt(v, 0), yfmt: v => fmt(v, Math.abs(yhi - ylo) < 0.15 ? 3 : Math.abs(yhi - ylo) < 1.5 ? 2 : 1) });
  geom = { xlo: 0.5 * p.K, xhi: 1.5 * p.K, iw: a.iw, left: ML, lo, hi };
  const x0 = a.x(p.S), bottom = h.mt + a.ih;
  let g = a.g + `<line x1="${a.x(p.K)}" x2="${a.x(p.K)}" y1="${h.mt}" y2="${bottom}" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  curves.forEach((c, i) => { g += line(c.map(([S, v]) => [a.x(S), a.y(v)]), colors[i], 2); });
  g += marker(x0, h.mt, bottom, "#475569", "2 3", `S₀ = ${fmt(p.S)}`, bottom - 6);
  mats.forEach((T, i) => {
    g += `<circle cx="${x0}" cy="${a.y(greekValue(bs({ ...p, T }), g0, opt))}" r="3.8" fill="${colors[i]}" stroke="#fff" stroke-width="1.2"/>`;
  });
  return svg(h.g + g, TXT.tabs[3]);
}
const svg = (inner, label) => `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${inner}</svg>`;

// ---------------------------------------------------------------- side panels
const kv = (l, v, cls = "") => `<div class="kv"><span>${l}</span><b${cls ? ` class="${cls}"` : ""}>${v}</b></div>`;
const big = (label, value, cls = "") => `<div class="big ${cls}"><small>${label}</small><span class="v">${value}</span></div>`;

function sidePrice(p) {
  const b = bs(p), call = opt === "call", name = TXT.optName[opt];
  const iS = call ? Math.max(p.S - p.K, 0) : Math.max(p.K - p.S, 0), tv = b[opt] - iS, gap = b.call + b.pvK - (b.put + b.pvS);
  return `<h3>${TXT.priceHead}</h3>` + kv("d₁", fmt(b.d1, 4)) + kv("d₂", fmt(b.d2, 4)) +
    kv("N(d₁)", fmt(b.n1, 4)) + kv("N(d₂)", fmt(b.n2, 4)) + kv("N(−d₁)", fmt(b.m1, 4)) + kv("N(−d₂)", fmt(b.m2, 4)) +
    kv(TXT.pvK, fmt(b.pvK, 4)) +
    `<div class="pair">${big(TXT.price.call, "$" + fmt(b.call))}${big(TXT.price.put, "$" + fmt(b.put))}</div>` +
    kv(TXT.intrinsicOf(name), fmt(iS)) + kv(TXT.timeOf(name), fmt(tv)) +
    `<div class="sub">${TXT.parity}</div>` + kv(TXT.parityL, fmt(b.call + b.pvK, 4)) + kv(TXT.parityR, fmt(b.put + b.pvS, 4)) +
    (Math.abs(gap) < 1e-9 * Math.max(1, b.pvK) ? `<div class="ok">${TXT.parityOk}</div>` : `<div class="ok" style="color:var(--loss)">${TXT.parityBad}</div>`) +
    (tv < -0.005 ? `<p class="note">${TXT.negTime}</p>` : "");
}

function sideDist(p) {
  const b = bs(p), sd = p.s * Math.sqrt(p.T);
  return `<h3>${TXT.probHead}</h3>` + kv("d₂", fmt(b.d2, 4)) +
    `<div class="pair">${big(TXT.pExercise, pct(b.n2))}${big(TXT.pLapse, pct(b.m2))}</div>` +
    kv(TXT.mean, fmt(p.S * Math.exp((p.r - p.q) * p.T))) +
    kv(TXT.median, fmt(p.S * Math.exp((p.r - p.q - p.s * p.s / 2) * p.T))) +
    kv(TXT.sdLog, fmt(sd, 4)) + kv(TXT.callRN, "$" + fmt(b.call)) +
    `<p class="note">${TXT.distNote}</p>`;
}

function sideIV(p, res) {
  const bounds = `$${fmt(res.lower)} ~ $${fmt(res.upper)}`;
  if (res.error) {
    const msg = res.error === "bounds" ? TXT.ivBoundsMsg(fmt(res.lower), fmt(res.upper)) : TXT.ivRangeMsg;
    return `<h3>${TXT.ivHead}</h3><div class="big bad"><small>${TXT.ivSigma}</small><span class="v">—</span></div>` +
           kv(TXT.ivBounds, bounds) + `<p class="note" style="color:var(--loss)">${msg}</p>`;
  }
  const k = Math.min(ivStep ?? res.steps.length, res.steps.length) - 1;
  const rows = res.steps.map((st, i) => `<tr data-k="${i + 1}"${i === k ? ' class="on"' : ""}><td>${i + 1}</td><td>${fmt(100 * st.mid, 4)}%</td>` +
    `<td>${fmt(st.v, 4)}</td><td>${TXT.ivCmp[st.v < mkt[opt] ? 0 : 1]}</td></tr>`).join("");
  return `<h3>${TXT.ivHead}</h3>${big(TXT.ivSigma, pct(res.sigma))}` +
    kv(TXT.ivRange, `${pct(IV_LO)} ~ ${pct(IV_HI, 0)}`) + kv(TXT.ivBounds, bounds) + kv(TXT.ivStop, TXT.ivStopVal) +
    kv(TXT.ivCount, res.steps.length) + kv(TXT.ivErr, "$" + fmt(res.miss, 5)) +
    `<div class="tscroll"><table class="steps"><thead><tr>${TXT.ivCols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function sideGreeks(p) {
  const b = bs(p), c = b.theta.call, u = b.theta.put;
  const rows = [
    [b.delta.call, b.delta.put, 4], [b.gamma, b.gamma, 5],
    [c, u, 4], [c / 252, u / 252, 5],
    [b.vega, b.vega, 4], [b.vega / 100, b.vega / 100, 4],
    [b.rho.call, b.rho.put, 4], [b.rho.call / 100, b.rho.put / 100, 4],
  ];
  return `<h3>${TXT.greekHead(fmt(p.S), fmtT(p.T))}</h3>` +
    `<table class="greeks"><thead><tr>${TXT.greekCols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(([x, y, d], i) => `<tr><td>${TXT.greekRows[i]}</td><td>${fmt(x, d)}</td><td>${fmt(y, d)}</td></tr>`).join("") +
    `</tbody></table>`;
}

// ---------------------------------------------------------------- wiring
const seg = (key, labels, cur) =>
  `<div class="seg" data-seg="${key}">${labels.map((l, i) => `<button type="button" data-i="${i}" class="${i === cur ? "on" : ""}">${l}</button>`).join("")}</div>`;
const optSeg = () => seg("opt", TXT.opt, opt === "call" ? 0 : 1);
let iv = null;

function renderTools() {
  const t = $("tools");
  t.hidden = tab === 1;
  if (tab === 0) t.innerHTML = optSeg();
  else if (tab === 2) {
    const n = iv.steps ? iv.steps.length : 0, k = iv.steps ? Math.min(ivStep ?? n, n) : 0;
    t.innerHTML = optSeg() + (n ? `<input type="range" id="stepRange" min="1" max="${n}" value="${k}" aria-label="${TXT.ivStep(k, n)}"><span class="lbl" id="stepLabel">${TXT.ivStep(k, n)}</span>` : "");
  } else if (tab === 3) t.innerHTML = seg("greek", TXT.greekTabs, greek) + optSeg();
}
function renderBody() {
  const p = model();
  fitCharts();
  geom = null;
  const chart = $("chart");
  if (tab === 2 && iv.error) {
    chart.innerHTML = `<div class="msg">${iv.error === "bounds" ? TXT.ivBoundsMsg(fmt(iv.lower), fmt(iv.upper)) : TXT.ivRangeMsg}</div>`;
  } else chart.innerHTML = [priceChart, distChart, p => ivChart(p, iv), greekChart][tab](p);
  chart.classList.toggle("drag", geom !== null);
  $("side").innerHTML = [sidePrice, sideDist, p => sideIV(p, iv), sideGreeks][tab](p);
  const on = document.querySelector(".steps tr.on");
  if (on) { const box = on.closest(".tscroll"); box.scrollTop = on.offsetTop - box.clientHeight / 2; }
}
function render() {
  const p = model();
  iv = solveIV(p, opt, mkt[opt]);
  $("tabs").innerHTML = TXT.tabs.map((t, i) => `<button type="button" data-t="${i}" class="${i === tab ? "on" : ""}">${t}</button>`).join("");
  $("presets").innerHTML = TXT.presets.map((t, i) => `<button type="button" data-p="${i}" class="${i === preset ? "on" : ""}">${t}</button>`).join("");
  $("w-sigma").hidden = tab === 2;
  $("w-mkt").hidden = tab !== 2;
  $("hint").textContent = TXT.hints[tab];
  renderTools();
  renderBody();
}

$("title").textContent = TXT.title;
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = +b.dataset.t; render(); } });
$("presets").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { applyPreset(+b.dataset.p); render(); } });
$("tools").addEventListener("click", e => {
  const b = e.target.closest("button"), key = b && b.parentElement.dataset.seg;
  if (!key) return;
  if (key === "opt") { opt = b.dataset.i === "0" ? "call" : "put"; ivStep = null; $("f-mkt").value = mkt[opt]; }
  else greek = +b.dataset.i;
  render();
});
$("tools").addEventListener("input", e => {
  if (e.target.id !== "stepRange") return;
  ivStep = +e.target.value;
  $("stepLabel").textContent = TXT.ivStep(ivStep, iv.steps.length);
  renderBody();
});
$("side").addEventListener("click", e => {
  const row = e.target.closest("tr[data-k]");
  if (row) { ivStep = +row.dataset.k; render(); }
});
$("inputs").addEventListener("input", () => {
  const v = readInputs();
  if (!v) return;
  if ("mkt" in v) { mkt[opt] = v.mkt; delete v.mkt; }
  Object.assign(P, v);
  preset = null;
  ivStep = null;
  render();
});
// Drag on the price and Greeks charts to move S₀ (the pointer stays captured by the view while the chart is redrawn).
let dragging = false;
function dragTo(e) {
  const box = $("chart").getBoundingClientRect(), f = (e.clientX - box.left - geom.left) / geom.iw;
  const S = Math.round(100 * Math.min(geom.xhi, Math.max(geom.xlo, geom.lo + f * (geom.hi - geom.lo)))) / 100;
  if (S === P.S0 || !(S > 0)) return;
  P.S0 = S;
  $("f-S0").value = S;
  $("f-S0").classList.remove("bad");
  preset = null;
  render();
}
$("view").addEventListener("pointerdown", e => {
  if (!geom || !e.target.closest("#chart")) return;
  dragging = true;
  $("view").setPointerCapture(e.pointerId);
  dragTo(e);
});
$("view").addEventListener("pointermove", e => { if (dragging && geom) dragTo(e); });
$("view").addEventListener("pointerup", () => { dragging = false; });
$("view").addEventListener("pointercancel", () => { dragging = false; });
let resizeQueued = false;
addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; renderBody(); });
});
applyPreset(TAB_KEYS[tab] === "greeks" ? 1 : 0);
render();
</script>
</body>
</html>

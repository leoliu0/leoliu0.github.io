<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动态 Delta 对冲模拟</title>
<!-- Lecture 10 app: sell call options, delta-hedge them along random stock price paths and
     compare the hedging cost with the Black-Scholes price. Add ?lang=en for English. -->
<link rel="stylesheet" href="assets/fonts/kai.css">
<style>
  :root {
    --navy: #1e3a8a; --accent: #2563eb; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --surface: #f8fafc; --gain: #15803d; --loss: #dc2626; --amber: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: "FandolKai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1.35; }
  button, input { font: inherit; }
  .app { max-width: 1100px; margin: 0 auto; padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 7px; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; color: var(--navy); }
  .bs { margin-left: auto; color: var(--muted); font-size: 12.5px; }
  .bs b { color: var(--navy); }
  .inputs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field input { width: 100%; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; color: var(--ink); background: #fff; }
  .field input.bad { border-color: var(--loss); background: #fef2f2; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lbl { color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 3px 11px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid #cbd5e1; }
  .seg button.on { background: var(--navy); color: #fff; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 3px 12px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--accent); }
  .btn:hover { filter: brightness(1.08); }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 252px; gap: 10px; }
  .panel { border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 8px 8px 0 0; }
  .tabs button { border: 0; background: none; padding: 5px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
  .view { height: max(340px, calc(100vh - 205px)); overflow: auto; padding: 4px 6px; }
  .view svg { display: block; width: 100%; height: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 2px 6px; text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
  .detail td { border-bottom: 1px solid #f1f5f9; }
  .detail tr.end td { background: #eff6ff; color: var(--navy); font-weight: 600; text-align: left; white-space: normal; }
  .neg { color: var(--loss); }
  .side { padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; height: max(371px, calc(100vh - 174px)); overflow: auto; }
  .side h3 { margin: 0 0 2px; font-size: 13.5px; color: var(--navy); }
  .kv { display: flex; justify-content: space-between; gap: 8px; }
  .kv span { color: var(--muted); }
  .kv b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big { margin: 3px 0; padding: 5px 8px; border-radius: 6px; background: #eff6ff; color: var(--navy); }
  .big .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big small { color: var(--muted); display: block; }
  .log { margin-top: 4px; font-size: 12px; }
  .log th, .log td { padding: 1px 4px; }
  .log tr.cur td { color: var(--navy); font-weight: 600; }
  .sum { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .sum b { color: var(--ink); }
  .stats { margin-top: 4px; }
  .stats td:first-child, .stats th:first-child { text-align: left; }
  .stats tr.on td { color: var(--navy); font-weight: 600; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) {
    .inputs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .main { grid-template-columns: 1fr; }
    .view { height: auto; max-height: 460px; }
    .side { height: auto; }
    .bs { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 id="title"></h1><span class="bs" id="bsline"></span></div>
  <div class="inputs" id="inputs"></div>
  <div class="controls">
    <span class="lbl" id="freqLabel"></span>
    <div class="seg" id="freq"></div>
    <button class="btn" id="newPath"></button>
    <button class="btn ghost" id="runSim"></button>
    <button class="btn ghost" id="clear"></button>
  </div>
  <div class="main">
    <section class="panel"><div class="tabs" id="tabs"></div><div class="view" id="view"></div></section>
    <aside class="panel side" id="side"></aside>
  </div>
  <p class="hint" id="hint"></p>
</div>
<script>
"use strict";
const LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
const TXT = {
  zh: {
    title: "动态 Delta 对冲：换一条股价路径，对冲照样有效",
    fields: { S0: "股价 S₀", K: "执行价 K", sigma: "波动率 σ (%)", T: "期限 T (周)", r: "利率 r (%)",
              mu: "股价漂移 μ (%)", N: "卖出看涨份数", prem: "售价/份 ($)" },
    bs: (each, n, total) => `BS 价格：每份 <b>$${each}</b>，${n} 份共 <b>$${total}</b>`,
    freqLabel: "再平衡：", freqs: ["每周", "每天", "每小时"], unit: ["周", "天", "小时"],
    newPath: "新的价格路径", runSim: "模拟 1,000 条路径", clear: "清空",
    tabs: ["价格路径", "对冲明细", "1,000 条模拟"],
    legend: ["股价", "持有股数（右轴）", "执行价 K", "之前的路径"],
    xWeek: "周", yPrice: "股价 ($)", yShares: "持有股数",
    cols: ["股价", "Delta", "买入（卖出）股数", "交易金额 ($)", "累计成本 ($)"],
    endItm: (n, k, rec, cost) => `到期实值：按 K = ${k} 交付 ${n} 股，收到 $${rec}。对冲成本 = 累计成本 − $${rec} = $${cost}`,
    endOtm: cost => `到期虚值：期权作废，不用交付。对冲成本 = 累计成本 = $${cost}`,
    rateNote: " （已按利率折现到今天）",
    pathHead: (k, f) => `本条路径 #${k}（${f}再平衡）`, paren: s => `（${s}）`,
    st: "到期股价 S_T", itm: "实值", otm: "虚值",
    cum: "买卖股票累计支出", rec: "行权收到 K × 份数",
    cost: "动态对冲成本", vsBs: d => `与 BS 价格相差 ${d}`,
    naked: "不对冲：到期赔付", profit: "卖方利润（权利金 − 成本）",
    hedged: "对冲", unhedged: "不对冲",
    logCols: ["#", "S_T", "对冲成本", "不对冲赔付"],
    summary: (n, mean, sd, nsd) => `${n} 条路径：对冲成本平均 <b>$${mean}</b>，标准差 <b>$${sd}</b>；不对冲赔付的标准差 <b>$${nsd}</b>`,
    simEmpty: "点“模拟 1,000 条路径”：同样的 1,000 条股价路径，分别按每周、每天、每小时再平衡，看卖方的成本分布在哪里。",
    simRows: (f) => [`不对冲（到期赔付）`, `动态对冲（${f}）`],
    simAxis: "卖方的成本 ($)", bsLine: "BS 价格",
    statCols: ["方式", "平均成本", "标准差", "标准差 ÷ BS"],
    statNaked: "不对冲", statFreq: f => `${f}再平衡`,
    simNote: "不对冲时成本的平均值也接近 BS 价格，但分散得多；对冲不改变平均成本，只把分散压小，再平衡越频繁越小。",
    hint: "试试：多点几次“新的价格路径”，对冲成本总在 BS 价格附近；改成每天或每小时再平衡，同一条路径的成本更接近 BS；把 μ 改成 30% 或 −30%，结论不变。",
  },
  en: {
    title: "Delta hedging: a new price path, the hedge still works",
    fields: { S0: "Stock S₀", K: "Strike K", sigma: "Volatility σ (%)", T: "T (weeks)", r: "Rate r (%)",
              mu: "Drift μ (%)", N: "Calls sold", prem: "Premium ($)" },
    bs: (each, n, total) => `BS price <b>$${each}</b> each, <b>$${total}</b> for ${n}`,
    freqLabel: "Rebalance:", freqs: ["weekly", "daily", "hourly"], unit: ["Week", "Day", "Hour"],
    newPath: "New price path", runSim: "Simulate 1,000 paths", clear: "Clear",
    tabs: ["Price path", "Hedge details", "1,000 simulations"],
    legend: ["Stock price", "Shares held (right axis)", "Strike K", "Earlier paths"],
    xWeek: "Week", yPrice: "Stock price ($)", yShares: "Shares held",
    cols: ["Price", "Delta", "Shares bought (sold)", "Cost of shares ($)", "Cumulative cost ($)"],
    endItm: (n, k, rec, cost) => `In the money at expiry: deliver ${n} shares at K = ${k} and receive $${rec}. Hedge cost = cumulative cost − $${rec} = $${cost}`,
    endOtm: cost => `Out of the money at expiry: the calls lapse, nothing to deliver. Hedge cost = cumulative cost = $${cost}`,
    rateNote: " (discounted to today at the interest rate)",
    pathHead: (k, f) => `Path #${k} (rebalanced ${f})`, paren: s => ` (${s})`,
    st: "S_T at expiry", itm: "ITM", otm: "OTM",
    cum: "Net spent on shares", rec: "Received on exercise",
    cost: "Dynamic hedge cost", vsBs: d => `${d} from the BS price`,
    naked: "No hedge: payout at expiry", profit: "Seller's profit (premium − cost)",
    hedged: "hedged", unhedged: "no hedge",
    logCols: ["#", "S_T", "Hedge cost", "No hedge"],
    summary: (n, mean, sd, nsd) => `${n} paths: hedge cost mean <b>$${mean}</b>, std dev <b>$${sd}</b>; no-hedge payout std dev <b>$${nsd}</b>`,
    simEmpty: "Click “Simulate 1,000 paths”: the same 1,000 stock price paths are hedged weekly, daily and hourly, to see where the seller's cost ends up.",
    simRows: (f) => ["No hedge (payout at expiry)", `Dynamic hedge (${f})`],
    simAxis: "Seller's cost ($)", bsLine: "BS price",
    statCols: ["Strategy", "Mean cost", "Std dev", "Std dev ÷ BS"],
    statNaked: "No hedge", statFreq: f => `Rebalanced ${f}`,
    simNote: "Without a hedge the average cost is also close to the BS price, but it is far more spread out. Hedging leaves the average unchanged and shrinks the spread, more so the more often you rebalance.",
    hint: "Try: draw several new paths, the hedge cost stays near the BS price. Switch to daily or hourly rebalancing: the same path gets closer to BS. Set μ to 30% or −30%: same result.",
  },
}[LANG];
document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
document.title = TXT.title;

// ---------------------------------------------------------------- maths
const HOURS_PER_WEEK = 35;          // 7 trading hours a day, 5 days a week
const STRIDE = [35, 7, 1];          // hourly steps between rebalances: weekly, daily, hourly
function ncdf(x) {                  // Abramowitz & Stegun 26.2.17, error < 1e-7
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const p = 0.3989422804014327 * Math.exp(-x * x / 2) *
    t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x > 0 ? 1 - p : p;
}
function d1(S, K, r, s, tau) { return (Math.log(S / K) + (r + s * s / 2) * tau) / (s * Math.sqrt(tau)); }
function bsCall(S, K, r, s, tau) {
  const a = d1(S, K, r, s, tau);
  return S * ncdf(a) - K * Math.exp(-r * tau) * ncdf(a - s * Math.sqrt(tau));
}
let spare = null;
function gauss() {
  if (spare !== null) { const z = spare; spare = null; return z; }
  let u = 0; while (u === 0) u = Math.random();
  const v = Math.random(), m = Math.sqrt(-2 * Math.log(u));
  spare = m * Math.sin(2 * Math.PI * v);
  return m * Math.cos(2 * Math.PI * v);
}
// One stock price path on an hourly grid (geometric Brownian motion with drift mu).
function pricePath(p) {
  const m = p.T * HOURS_PER_WEEK, dt = p.T / 52 / m;
  const drift = (p.mu - p.sigma * p.sigma / 2) * dt, vol = p.sigma * Math.sqrt(dt);
  const S = new Float64Array(m + 1);
  S[0] = p.S0;
  for (let i = 1; i <= m; i++) S[i] = S[i - 1] * Math.exp(drift + vol * gauss());
  return S;
}
// Hull's dynamic hedge of N sold calls: hold round(N x delta) shares, rebalanced every
// STRIDE[f] hours; cumulative cost earns interest; the hedge cost is discounted to today.
function hedge(p, S, f, keepRows) {
  const stride = STRIDE[f], n = (S.length - 1) / stride, T = p.T / 52, dt = T / n, grow = Math.exp(p.r * dt);
  const rows = keepRows ? [] : null;
  let held = 0, cum = 0;
  for (let j = 0; j <= n; j++) {
    const s = S[j * stride];
    if (j > 0) cum *= grow;
    const d = j < n ? ncdf(d1(s, p.K, p.r, p.sigma, T - j * dt)) : (s > p.K ? 1 : 0);
    const target = Math.round(p.N * d), buy = target - held;
    cum += buy * s;
    held = target;
    if (rows) rows.push({ j, s, d, buy, cum, held });
  }
  const ST = S[S.length - 1], itm = ST > p.K, received = itm ? p.K * p.N : 0, disc = Math.exp(-p.r * T);
  return { rows, cum, received, ST, itm, cost: (cum - received) * disc,
           payout: Math.max(ST - p.K, 0) * p.N * disc };
}
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / Math.max(a.length - 1, 1)); };

// ---------------------------------------------------------------- formatting
const fmt = (x, d = 0) => (x < 0 ? "−" : "") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const paren = (x, d = 0) => x < 0 ? `(${fmt(-x, d)})` : fmt(x, d);
const money = x => { const v = Math.round(x); return (v < 0 ? "−$" : "$") + fmt(Math.abs(v)); };
const signed = x => (Math.round(x) > 0 ? "+" : "") + money(x);
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

// ---------------------------------------------------------------- inputs and state
const FIELDS = [
  ["S0", 100, 1, 1], ["K", 100, 1, 1], ["sigma", 20, 1, 0.01], ["T", 5, 1, 1],
  ["r", 0, 0.5, 0.01], ["mu", 0, 5, 0.01], ["N", 1000, 100, 1], ["prem", 2.5, 0.05, 1],
];
const inputs = document.getElementById("inputs");
inputs.innerHTML = FIELDS.map(([k, v, step]) =>
  `<div class="field"><label for="f-${k}" title="${TXT.fields[k]}">${TXT.fields[k]}</label>` +
  `<input id="f-${k}" type="number" value="${v}" step="${step}"></div>`).join("");
function readParams() {
  const v = {};
  let ok = true;
  for (const [k, , , scale] of FIELDS) {
    const el = document.getElementById(`f-${k}`), x = Number(el.value);
    const bad = !Number.isFinite(el.valueAsNumber) ||
      (["S0", "K", "sigma", "N", "T"].includes(k) && x <= 0) || (k === "prem" && x < 0) ||
      (k === "T" && (!Number.isInteger(x) || x > 52)) || (k === "N" && !Number.isInteger(x)) ||
      (["r", "mu"].includes(k) && Math.abs(x) > 100);
    el.classList.toggle("bad", bad);
    ok = ok && !bad;
    v[k] = x * scale;
  }
  return ok ? v : null;
}
let P = readParams(), freq = 0, tab = 0, paths = [], made = 0, sim = null;
const bsEach = () => bsCall(P.S0, P.K, P.r, P.sigma, P.T / 52);

function addPath() {
  paths.push({ id: ++made, S: pricePath(P) });
  if (paths.length > 200) paths.shift();
}
function runSim() {
  const costs = [[], [], []], payouts = [];
  for (let k = 0; k < 1000; k++) {
    const S = pricePath(P);
    for (let f = 0; f < 3; f++) costs[f].push(hedge(P, S, f, false).cost);
    payouts.push(hedge(P, S, 0, false).payout);
  }
  sim = { costs, payouts };
}

// ---------------------------------------------------------------- views
// Charts are drawn at the panel's own pixel size, so text stays 11-12 px however wide the frame is.
let W = 520, H = 352;
function fitCharts() {
  const view = document.getElementById("view"), narrow = matchMedia("(max-width: 700px)").matches;
  W = Math.max(320, view.clientWidth - 12);
  H = narrow ? Math.round(W * 0.72) : Math.max(260, view.clientHeight - 12);
}
const textW = s => [...s].reduce((w, c) => w + (/[\u2e80-\u9fff\uff00-\uffef]/.test(c) ? 11.5 : 6.6), 0);
function priceChart() {
  const ml = 44, mr = 50, mb = 34;
  const cur = paths[paths.length - 1], shown = paths.slice(-13), h = hedge(P, cur.S, freq, true);
  // legend entries flow left to right and wrap onto a second row in a narrow frame
  const items = [["#1e3a8a", "", 2], ["#d97706", "", 1.6], ["#dc2626", ' stroke-dasharray="5 4"', 1.2], ["#94a3b8", "", 1]]
    .map((s, i) => [...s, TXT.legend[i]]).slice(0, shown.length > 1 ? 4 : 3);
  let lx = ml, ly = 11, legend = "";
  for (const [color, dash, wid, label] of items) {
    const w = 22 + textW(label);
    if (lx > ml && lx + w > W - 4) { lx = ml; ly += 17; }
    legend += `<line x1="${lx}" x2="${lx + 18}" y1="${ly}" y2="${ly}" stroke="${color}" stroke-width="${wid}"${dash}/><text x="${lx + 22}" y="${ly + 4}">${label}</text>`;
    lx += w + 16;
  }
  const mt = ly + 15;
  let lo = P.K, hi = P.K;
  for (const p of shown) for (const v of p.S) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const pad = (hi - lo) * 0.06 || 1;
  lo -= pad; hi += pad;
  const m = cur.S.length - 1, iw = W - ml - mr, ih = H - mt - mb;
  const x = i => ml + iw * i / m, y = v => mt + ih * (hi - v) / (hi - lo), ys = q => mt + ih * (1 - q / P.N);
  const line = S => Array.from(S, (v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let g = "";
  for (const t of niceTicks(lo, hi, Math.max(4, Math.round(ih / 45))))
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" stroke="#eef2f7"/>` +
         `<text x="${ml - 6}" y="${y(t) + 4}" text-anchor="end" fill="#64748b" font-size="11">${fmt(t, t % 1 ? 1 : 0)}</text>`;
  for (const q of [0, P.N / 2, P.N])
    g += `<text x="${W - mr + 6}" y="${ys(q) + 4}" fill="#b45309" font-size="11">${fmt(q)}</text>`;
  const weeks = P.T, every = Math.ceil(weeks / 10);
  for (let w = 0; w <= weeks; w += every) {
    const xi = x(w * HOURS_PER_WEEK);
    g += `<line x1="${xi}" x2="${xi}" y1="${mt + ih}" y2="${mt + ih + 4}" stroke="#94a3b8"/>` +
         `<text x="${xi}" y="${mt + ih + 16}" text-anchor="middle" fill="#64748b" font-size="11">${w}</text>`;
  }
  g += `<text x="${ml + iw / 2}" y="${H - 4}" text-anchor="middle" fill="#64748b" font-size="11.5">${TXT.xWeek}</text>`;
  g += `<rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="none" stroke="#cbd5e1"/>`;
  for (const p of shown.slice(0, -1))
    g += `<polyline points="${line(p.S)}" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.45"/>`;
  g += `<line x1="${ml}" x2="${W - mr}" y1="${y(P.K)}" y2="${y(P.K)}" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.2"/>`;
  // shares held between rebalances (a step line on the right axis)
  const st = STRIDE[freq];
  const steps = h.rows.map(r => {
    const x0 = x(r.j * st), x1 = x(Math.min((r.j + 1) * st, m));
    return `${x0},${ys(r.held)} ${x1},${ys(r.held)}`;
  }).join(" ");
  g += `<polyline points="${steps}" fill="none" stroke="#d97706" stroke-width="1.6" opacity="0.9"/>`;
  g += `<polyline points="${line(cur.S)}" fill="none" stroke="#1e3a8a" stroke-width="2"/>`;
  if (h.rows.length <= 60)
    for (const r of h.rows) g += `<circle cx="${x(r.j * st)}" cy="${y(r.s)}" r="2.8" fill="#1e3a8a" stroke="#fff" stroke-width="1"/>`;
  g += `<g font-size="11.5" fill="#334155">${legend}</g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${TXT.tabs[0]}">${g}</svg>`;
}

function detailTable() {
  const cur = paths[paths.length - 1], h = hedge(P, cur.S, freq, true);
  const head = `<tr><th>${TXT.unit[freq]}</th>${TXT.cols.map(c => `<th>${c}</th>`).join("")}</tr>`;
  const body = h.rows.map(r => `<tr><td>${r.j}</td><td>${fmt(r.s, 2)}</td><td>${r.d.toFixed(3)}</td>` +
    `<td${r.buy < 0 ? ' class="neg"' : ""}>${paren(r.buy)}</td><td${r.buy < 0 ? ' class="neg"' : ""}>${paren(r.buy * r.s)}</td>` +
    `<td>${fmt(r.cum)}</td></tr>`).join("");
  const end = (h.itm ? TXT.endItm(fmt(P.N), fmt(P.K, P.K % 1 ? 2 : 0), fmt(h.received), fmt(h.cost))
                     : TXT.endOtm(fmt(h.cost))) + (P.r ? TXT.rateNote : "");
  return `<table class="detail"><thead>${head}</thead><tbody>${body}<tr class="end"><td colspan="6">${end}</td></tr></tbody></table>`;
}

function simView() {
  if (!sim) return `<p style="color:#64748b;margin:12px 6px">${TXT.simEmpty}</p>`;
  const bs = bsEach() * P.N, hedged = sim.costs[freq], all = [...sim.payouts, ...hedged];
  const lo = Math.min(0, ...all), hi = Math.max(...all), bins = 50, bw = (hi - lo) / bins || 1;
  const ml = 12, mr = 12, rowH = 66, top = 6, iw = W - ml - mr, x = v => ml + iw * (v - lo) / (hi - lo || 1);
  const rows = [sim.payouts, hedged], colors = ["#d97706", "#1e3a8a"], labels = TXT.simRows(TXT.freqs[freq]);
  let g = "";
  rows.forEach((data, k) => {
    const c = new Array(bins).fill(0);
    for (const v of data) c[Math.min(bins - 1, Math.floor((v - lo) / bw))]++;
    const peak = Math.max(...c), y0 = top + k * (rowH + 14) + rowH;
    g += `<text x="${W - mr}" y="${y0 - rowH + 12}" text-anchor="end" font-size="12" fill="${colors[k]}" font-weight="600">${labels[k]}</text>`;
    c.forEach((n, i) => {
      if (!n) return;
      const hgt = Math.max(1.5, (rowH - 18) * n / peak);
      g += `<rect x="${(x(lo + i * bw) + 0.5).toFixed(1)}" y="${(y0 - hgt).toFixed(1)}" width="${Math.max(1, iw / bins - 1).toFixed(1)}" height="${hgt.toFixed(1)}" fill="${colors[k]}" opacity="0.85"/>`;
    });
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y0}" y2="${y0}" stroke="#94a3b8"/>`;
  });
  const yb = top + 2 * rowH + 14;
  g += `<line x1="${x(bs)}" x2="${x(bs)}" y1="${top + 14}" y2="${yb + 4}" stroke="#dc2626" stroke-dasharray="4 3"/>` +
       `<text x="${x(bs) + 4}" y="${top + 24}" font-size="11" fill="#dc2626">${TXT.bsLine} $${fmt(bs)}</text>`;
  for (const t of niceTicks(lo, hi, 6))
    g += `<text x="${x(t)}" y="${yb + 16}" text-anchor="middle" font-size="11" fill="#64748b">${fmt(t)}</text>`;
  g += `<text x="${W / 2}" y="${yb + 30}" text-anchor="middle" font-size="11.5" fill="#64748b">${TXT.simAxis}</text>`;
  const stat = (label, a, on) => `<tr${on ? ' class="on"' : ""}><td>${label}</td><td>$${fmt(mean(a))}</td><td>$${fmt(sd(a))}</td><td>${(100 * sd(a) / bs).toFixed(1)}%</td></tr>`;
  const table = `<table class="stats"><thead><tr>${TXT.statCols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>` +
    stat(TXT.statNaked, sim.payouts, false) + [0, 1, 2].map(f => stat(TXT.statFreq(TXT.freqs[f]), sim.costs[f], f === freq)).join("") +
    `</tbody></table>`;
  return `<svg viewBox="0 0 ${W} ${yb + 36}" role="img" aria-label="${TXT.tabs[2]}">${g}</svg>${table}` +
         `<p class="sum" style="margin:4px 2px">${TXT.simNote}</p>`;
}

function sidePanel() {
  const bs = bsEach() * P.N, cur = paths[paths.length - 1], h = hedge(P, cur.S, freq, false);
  const premium = P.prem * P.N;
  const log = paths.slice(-5).reverse().map(p => {
    const q = hedge(P, p.S, freq, false);
    return `<tr${p === cur ? ' class="cur"' : ""}><td>${p.id}</td><td>${fmt(q.ST, 2)}</td><td>${money(q.cost)}</td><td>${money(q.payout)}</td></tr>`;
  }).join("");
  const costs = paths.map(p => hedge(P, p.S, freq, false)), pc = costs.map(q => q.cost), pp = costs.map(q => q.payout);
  return `<h3>${TXT.pathHead(cur.id, TXT.freqs[freq])}</h3>` +
    `<div class="kv"><span>${TXT.st}</span><b>${fmt(h.ST, 2)}${TXT.paren(h.itm ? TXT.itm : TXT.otm)}</b></div>` +
    `<div class="kv"><span>${TXT.cum}</span><b>${money(h.cum)}</b></div>` +
    `<div class="kv"><span>${TXT.rec}</span><b>${money(h.received)}</b></div>` +
    `<div class="big"><small>${TXT.cost}</small><span class="v">${money(h.cost)}</span>` +
    `<small>${TXT.vsBs(signed(h.cost - bs))}${TXT.paren(`BS $${fmt(bs)}`)}</small></div>` +
    `<div class="kv"><span>${TXT.naked}</span><b>${money(h.payout)}</b></div>` +
    `<div class="kv"><span>${TXT.profit}</span></div>` +
    `<div class="kv"><span>&nbsp;&nbsp;${TXT.hedged}</span><b class="${premium - h.cost < 0 ? "neg" : ""}">${signed(premium - h.cost)}</b></div>` +
    `<div class="kv"><span>&nbsp;&nbsp;${TXT.unhedged}</span><b class="${premium - h.payout < 0 ? "neg" : ""}">${signed(premium - h.payout)}</b></div>` +
    `<table class="log"><thead><tr>${TXT.logCols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${log}</tbody></table>` +
    (paths.length > 1 ? `<p class="sum">${TXT.summary(paths.length, fmt(mean(pc)), fmt(sd(pc)), fmt(sd(pp)))}</p>` : "");
}

// ---------------------------------------------------------------- wiring
const $ = id => document.getElementById(id);
function render() {
  const each = bsEach();
  $("bsline").innerHTML = TXT.bs(fmt(each, 2), fmt(P.N), fmt(each * P.N));
  $("freq").innerHTML = TXT.freqs.map((f, i) => `<button type="button" data-f="${i}" class="${i === freq ? "on" : ""}">${f}</button>`).join("");
  $("tabs").innerHTML = TXT.tabs.map((t, i) => `<button type="button" data-t="${i}" class="${i === tab ? "on" : ""}">${t}</button>`).join("");
  fitCharts();
  $("view").innerHTML = [priceChart, detailTable, simView][tab]();
  $("side").innerHTML = sidePanel();
}
$("title").textContent = TXT.title;
$("freqLabel").textContent = TXT.freqLabel;
$("newPath").textContent = TXT.newPath;
$("runSim").textContent = TXT.runSim;
$("clear").textContent = TXT.clear;
$("hint").textContent = TXT.hint;
$("freq").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { freq = +b.dataset.f; render(); } });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = +b.dataset.t; render(); } });
$("newPath").addEventListener("click", () => { addPath(); if (tab === 2) tab = 0; render(); });
$("runSim").addEventListener("click", () => { runSim(); tab = 2; render(); });
$("clear").addEventListener("click", () => { paths = []; made = 0; sim = null; addPath(); tab = 0; render(); });
inputs.addEventListener("change", () => {
  const p = readParams();
  if (!p) return;
  P = p; paths = []; made = 0; sim = null; addPath(); render();
});
let resizeQueued = false;
addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; render(); });
});
addPath();
render();
</script>
</body>
</html>

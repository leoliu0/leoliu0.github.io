<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期货保证金账户</title>
<!-- Lecture 1 app: a futures margin account with daily settlement, margin calls and top-ups back
     to the initial margin. Presets reproduce the two slide examples (?preset=gold or emini).
     Add ?lang=en for English. -->
<link rel="stylesheet" href="assets/fonts/kai.css">
<style>
  :root {
    --navy: #1e3a8a; --accent: #2563eb; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --surface: #f8fafc; --gain: #15803d; --loss: #dc2626; --amber: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: "FandolKai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1.35; }
  button, input { font: inherit; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .app { max-width: 1100px; margin: 0 auto; padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 7px; }
  .top { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; color: var(--navy); }
  .nv { margin-left: auto; color: var(--muted); font-size: 12.5px; }
  .nv b { color: var(--navy); }
  .inputs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field input { width: 100%; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; color: var(--ink); background: #fff; }
  .field input.bad, td input.bad { border-color: var(--loss); background: #fef2f2; }
  .controls { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .lbl { color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 3px 11px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid #cbd5e1; }
  .seg button.on { background: var(--navy); color: #fff; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 3px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: #fff; color: var(--accent); }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 10px; }
  .panel { border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 0; }
  .tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 8px 8px 0 0; }
  .tabs button { border: 0; background: none; padding: 5px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
  .steps { margin-left: auto; display: flex; gap: 4px; padding: 0 6px; }
  .steps .btn { padding: 1px 9px; }
  .view { position: relative; height: max(330px, calc(100vh - 213px)); overflow: auto; padding: 4px 6px; }
  .view svg { display: block; width: 100%; height: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 1px 5px; text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; z-index: 1; padding: 1px 3px; background: var(--surface); color: var(--muted); font-weight: 600; white-space: normal; line-height: 1.2; vertical-align: bottom; border-bottom: 1px solid var(--line); }
  html[lang="zh-CN"] th { white-space: nowrap; }
  .detail td { padding: 0 3px; border-bottom: 1px solid #f1f5f9; }
  .detail td:first-child, .detail th:first-child { text-align: center; }
  .detail input { width: 68px; height: 18px; padding: 0 4px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: right; font-size: 12.5px; color: var(--ink); background: #fff; }
  .detail tr.cur td { background: #eff6ff; color: var(--navy); font-weight: 600; }
  .detail tr.future td { color: #94a3b8; }
  .detail tr.future input { color: var(--muted); }
  .detail tr td.dep { color: var(--gain); font-weight: 700; }
  .detail tr td.low, .detail tr td.neg { color: var(--loss); }
  .eq b { white-space: nowrap; }
  .neg { color: var(--loss); }
  .side { padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; height: max(366px, calc(100vh - 182px)); overflow: auto; }
  .side h3 { margin: 4px 0 1px; font-size: 13.5px; color: var(--navy); }
  .side h3:first-child { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; gap: 8px; }
  .kv span { color: var(--muted); }
  .kv b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kv b.dep { color: var(--gain); }
  .big { margin: 2px 0 3px; padding: 4px 8px; border-radius: 6px; background: #eff6ff; color: var(--navy); }
  .big.call { background: #fffbeb; color: #92400e; box-shadow: inset 0 0 0 1px #fde68a; }
  .eq { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .eq div { color: var(--ink); font-variant-numeric: tabular-nums; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) {
    .inputs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .main { grid-template-columns: 1fr; }
    .view { height: auto; max-height: 460px; }
    .detail th, .detail td { padding: 0 2px; font-size: 12px; }
    .detail input { width: 58px; font-size: 12px; }
    .side { height: auto; }
    .nv { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 id="title"></h1><span class="nv" id="nvline"></span></div>
  <div class="inputs" id="inputs"></div>
  <div class="controls">
    <div class="seg" id="pos"></div>
    <span class="lbl" id="presetLabel"></span>
    <div class="seg" id="presets"></div>
    <button class="btn ghost" id="random" type="button"></button>
  </div>
  <div class="main">
    <section class="panel">
      <div class="tabs"><div id="tabs"></div><div class="steps" id="steps"></div></div>
      <div class="view" id="view"></div>
    </section>
    <aside class="panel side" id="side"></aside>
  </div>
  <p class="hint" id="hint"></p>
</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const LANG = params.get("lang") === "en" ? "en" : "zh";
const TXT = {
  zh: {
    title: "期货保证金账户：每日结算",
    top: (nv, im, mm) => `名义价值 <b>${nv}</b>　初始保证金合计 <b>${im}</b>　维持保证金合计 <b>${mm}</b>`,
    fields: { N: "合约张数", size: "每张合约规模", IM: "初始保证金/张 ($)", MM: "维持保证金/张 ($)",
              F0: "期初价格 F₀", n: "天数", sigma: "随机日波动 (%)" },
    pos: ["多头", "空头"],
    presetLabel: "预设：", presets: ["黄金期货", "E-Mini 标普500"],
    random: "随机价格路径",
    tabs: ["图表", "每日明细"],
    steps: ["◀ 上一天", "下一天 ▶", "显示全部", "重置"],
    legend: ["账户余额（左轴）", "初始保证金", "维持保证金", "追加保证金", "期货价格（右轴）"],
    xDay: "天",
    cols: ["日", "期货价格", "当日盈亏", "累计盈亏", "追加前余额", "追加保证金", "可提取"],
    colTips: ["第几天", "期货价格 ($)，可直接修改", "当日盈亏 ($)", "累计盈亏 ($)", "当天结算后、追加之前的账户余额 ($)",
              "追加保证金 ($)：追加后余额回到初始保证金", "余额超过初始保证金的部分，可以提走 ($)"],
    head: d => d === 0 ? "开户（第 0 天）" : `第 ${d} 天`,
    open: (im, f) => `存入初始保证金 <b>${im}</b>，开仓价格 ${f}。`,
    fine: (b, m) => `余额 <b>${b}</b> ≥ 维持保证金 ${m}，无需追加。`,
    call: (b, m, c, i) => `余额 <b>${b}</b> 低于维持保证金 ${m}：追加 <b>${c}</b>，补回<b>初始保证金</b> ${i}，不是只补到 ${m}。`,
    rows: ["当日盈亏", "累计盈亏", "追加前余额", "追加保证金", "追加后余额", "可提取"],
    sumHead: d => `累计汇总（到第 ${d} 天）`,
    deposits: k => `累计追加（${k} 次）`,
    gainEq: "总盈亏 = (F − F₀) × 规模 × 张数",
    shortSign: " × (−1)",
    balEq: "余额 = 初始保证金 + 总盈亏 + 追加",
    hint: "试试：先点“重置”，再逐日点“下一天”；把某天的价格改低，看余额跌破维持保证金后，追加金额补回的是初始保证金；切换成空头，价格上涨才亏钱。",
  },
  en: {
    title: "Futures margin account",
    top: (nv, im, mm) => `Notional <b>${nv}</b>　Initial <b>${im}</b>　Maintenance <b>${mm}</b>`,
    fields: { N: "Contracts", size: "Size / contract", IM: "Initial / ctr ($)", MM: "Maint. / ctr ($)",
              F0: "Start price F₀", n: "Days", sigma: "Daily σ (%)" },
    pos: ["Long", "Short"],
    presetLabel: "Preset:", presets: ["Gold futures", "E-Mini S&P 500"],
    random: "Random price path",
    tabs: ["Chart", "Table"],
    steps: ["◀ Prev", "Next day ▶", "All", "Reset"],
    legend: ["Balance (left)", "Initial margin", "Maintenance", "Margin call", "Price (right)"],
    xDay: "Day",
    cols: ["Day", "Futures price", "Daily gain", "Cumulative gain", "Pre-call balance", "Margin call", "Excess"],
    colTips: ["Day number", "Futures price ($), editable", "Daily gain (loss) ($)", "Cumulative gain (loss) ($)",
              "Balance after the day's settlement, before the margin call ($)",
              "Margin call ($): the balance is back at the initial margin afterwards",
              "Balance above the initial margin, which can be withdrawn ($)"],
    head: d => d === 0 ? "Opening (day 0)" : `Day ${d}`,
    open: (im, f) => `Deposit the initial margin <b>${im}</b>; entry price ${f}.`,
    fine: (b, m) => `Balance <b>${b}</b> ≥ maintenance margin ${m}: no call.`,
    call: (b, m, c, i) => `Balance <b>${b}</b> < maintenance ${m}: deposit <b>${c}</b> to restore the <b>initial margin</b> ${i}.`,
    rows: ["Daily gain", "Cumulative gain", "Balance before call", "Margin call", "Balance after call", "Excess"],
    sumHead: d => `Totals to day ${d}`,
    deposits: k => `Deposits (${k} ${k === 1 ? "call" : "calls"})`,
    gainEq: "Total gain = (F − F₀) × size × contracts",
    shortSign: " × (−1)",
    balEq: "Balance = initial margin + gain + deposits",
    hint: "Try: click Reset, then Next day one day at a time. Lower a day's price: after the balance falls below the maintenance margin, the deposit restores the initial margin. Switch to Short: now a rising price loses money.",
  },
}[LANG];
document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
document.title = LANG === "en" ? "Futures margin account" : "期货保证金账户";

// ---------------------------------------------------------------- presets (the slide examples)
const PRESETS = {
  gold: {   // lecture 1, slide 14: Hull's gold example, 2 contracts, 16 trading days
    pos: 1, N: 2, size: 100, IM: 2000, MM: 1500, F0: 400,
    prices: [397.00, 396.10, 398.20, 397.10, 396.70, 395.40, 393.30, 393.60, 391.80, 392.70, 387.00, 387.00, 388.10, 388.70, 391.00, 392.30],
  },
  emini: {  // lecture 1 enrichment slide: E-Mini S&P 500, index 2,800, $50 per point
    pos: 1, N: 1, size: 50, IM: 5500, MM: 5000, F0: 2800,
    prices: [2795, 2785],
  },
};
const PRESET_KEYS = ["gold", "emini"];

// ---------------------------------------------------------------- formatting and helpers
const $ = id => document.getElementById(id);
const clean = x => Math.round(x * 1e6) / 1e6;          // drop floating point noise
const fmt = (x, d = 0) => (x < 0 ? "−" : "") + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
let D = 0;                                               // decimals for money: 2 only if some amount has cents
const num = x => fmt(x, D);
const paren = x => x < 0 ? `(${fmt(-x, D)})` : fmt(x, D);
const money = x => (x < 0 ? "−$" : "$") + fmt(Math.abs(x), D);
const textW = s => [...s].reduce((w, c) => w + (/[\u2e80-\u9fff\uff00-\uffef]/.test(c) ? 11.5 : 6.6), 0);
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

// ---------------------------------------------------------------- inputs and state
const FIELDS = ["N", "size", "IM", "MM", "F0", "n", "sigma"];
const RULES = {
  N: x => Number.isInteger(x) && x >= 1 && x <= 100000, size: x => x > 0, IM: x => x > 0, MM: x => x > 0,
  F0: x => x > 0, n: x => Number.isInteger(x) && x >= 1 && x <= 60, sigma: x => x >= 0 && x <= 20,
};
$("inputs").innerHTML = FIELDS.map(k =>
  `<div class="field"><label for="f-${k}" title="${TXT.fields[k]}">${TXT.fields[k]}</label>` +
  `<input id="f-${k}" type="number" step="any"></div>`).join("");
$("f-sigma").value = 0.7;
function readParams() {
  const v = {}, good = {};
  for (const k of FIELDS) { v[k] = $(`f-${k}`).valueAsNumber; good[k] = Number.isFinite(v[k]) && RULES[k](v[k]); }
  if (good.IM && good.MM && v.MM > v.IM) good.MM = false;      // maintenance margin cannot exceed initial margin
  for (const k of FIELDS) $(`f-${k}`).classList.toggle("bad", !good[k]);
  return FIELDS.every(k => good[k]) ? v : null;
}
let P, pos = 1, prices = [], shown = 0, tab = 0, preset = null, S;

function applyPreset(key) {
  const s = PRESETS[key];
  pos = s.pos; prices = [...s.prices];
  for (const k of ["N", "size", "IM", "MM", "F0"]) $(`f-${k}`).value = s[k];
  $("f-n").value = prices.length;
  P = readParams(); shown = P.n; preset = key;
}
function applyParams(p) {
  const old = prices.length;
  P = p;
  if (p.n < old) prices.length = p.n;
  else while (prices.length < p.n) prices.push(prices.length ? prices[prices.length - 1] : p.F0);
  shown = shown === old ? p.n : Math.min(shown, p.n);
}
function randomPath() {
  let F = P.F0;
  prices = Array.from({ length: P.n }, () => (F = Math.max(0.01, Math.round(F * (1 + P.sigma / 100 * gauss()) * 100) / 100)));
  shown = P.n; preset = null;
}

// ---------------------------------------------------------------- the margin account (Hull's rules)
// Each day: balance = last balance after any call + daily gain. If it is below the maintenance
// margin, the trader deposits enough to bring it back up to the INITIAL margin.
function simulate() {
  const IMt = P.IM * P.N, MMt = P.MM * P.N, mult = pos * P.size * P.N;
  const rows = [{ d: 0, F: P.F0, gain: 0, cum: 0, pre: IMt, call: 0, post: IMt, avail: 0, dep: 0, calls: 0 }];
  prices.forEach((F, i) => {
    const prev = rows[i], gain = clean((F - prev.F) * mult), pre = clean(prev.post + gain);
    const call = pre < MMt ? clean(IMt - pre) : 0, post = clean(pre + call);
    rows.push({ d: i + 1, F, gain, cum: clean(prev.cum + gain), pre, call, post, avail: Math.max(0, clean(post - IMt)),
                dep: clean(prev.dep + call), calls: prev.calls + (call > 0 ? 1 : 0) });
  });
  const amounts = rows.flatMap(r => [r.gain, r.cum, r.pre, r.call, r.post, r.avail]).concat(IMt, MMt);
  D = amounts.every(Number.isInteger) ? 0 : 2;
  return { rows, IMt, MMt, mult };
}

// ---------------------------------------------------------------- views
// The chart is drawn at the panel's own pixel size, so text stays 11-12 px however wide the frame is.
let W = 520, H = 352;
function fitCharts() {
  const view = $("view"), narrow = matchMedia("(max-width: 700px)").matches;
  W = Math.max(320, view.clientWidth - 12);
  H = narrow ? Math.round(W * 0.72) : Math.max(260, view.clientHeight - 12);
}
function chart() {
  const { rows, IMt, MMt } = S, n = P.n, ticksN = Math.max(4, Math.round((H - 90) / 45));
  const bals = rows.flatMap(r => [r.pre, r.post]).concat(IMt, MMt), pr = rows.map(r => r.F);
  let lo = Math.min(...bals), hi = Math.max(...bals), plo = Math.min(...pr), phi = Math.max(...pr);
  const pad = (hi - lo) * 0.08 || 1, ppad = (phi - plo) * 0.08 || 1;
  lo -= pad; hi += pad; plo -= ppad; phi += ppad;
  const lt = niceTicks(lo, hi, ticksN), rt = niceTicks(plo, phi, ticksN);
  const rstep = rt.length > 1 ? +(rt[1] - rt[0]).toFixed(6) : 1, rdec = rstep >= 1 ? 0 : rstep >= 0.1 ? 1 : 2;
  const ldec = t => t % 1 ? 2 : 0;
  const ml = 14 + Math.max(...lt.map(t => textW(fmt(t, ldec(t))))), mr = 14 + Math.max(...rt.map(t => textW(fmt(t, rdec))));
  // legend entries flow left to right and wrap onto a second row in a narrow frame
  const sample = [
    (x, y) => `<line x1="${x}" x2="${x + 18}" y1="${y}" y2="${y}" stroke="#1e3a8a" stroke-width="2"/><circle cx="${x + 9}" cy="${y}" r="2.8" fill="#1e3a8a"/>`,
    (x, y) => `<line x1="${x}" x2="${x + 18}" y1="${y}" y2="${y}" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/>`,
    (x, y) => `<line x1="${x}" x2="${x + 18}" y1="${y}" y2="${y}" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>`,
    (x, y) => `<line x1="${x}" x2="${x + 18}" y1="${y}" y2="${y}" stroke="#15803d" stroke-width="2.4"/><polygon points="${x + 9},${y - 5} ${x + 4},${y + 3} ${x + 14},${y + 3}" fill="#15803d"/>`,
    (x, y) => `<line x1="${x}" x2="${x + 18}" y1="${y}" y2="${y}" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3"/>`,
  ];
  let lx = ml, ly = 11, legend = "";
  TXT.legend.forEach((label, i) => {
    const w = 22 + textW(label);
    if (lx > ml && lx + w > W - 4) { lx = ml; ly += 17; }
    legend += sample[i](lx, ly) + `<text x="${lx + 22}" y="${ly + 4}">${label}</text>`;
    lx += w + 14;
  });
  const mt = ly + 15, mb = 32, iw = W - ml - mr, ih = H - mt - mb;
  const x = d => ml + iw * d / n, y = v => mt + ih * (hi - v) / (hi - lo), yp = v => mt + ih * (phi - v) / (phi - plo);
  let g = "";
  for (const t of lt)
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" stroke="#eef2f7"/>` +
         `<text x="${ml - 6}" y="${y(t) + 4}" text-anchor="end" fill="#64748b" font-size="11">${fmt(t, ldec(t))}</text>`;
  for (const t of rt)
    g += `<text x="${W - mr + 6}" y="${yp(t) + 4}" fill="#b45309" font-size="11">${fmt(t, rdec)}</text>`;
  const every = Math.ceil(n / 12);
  for (let d = 0; d <= n; d += every)
    g += `<line x1="${x(d)}" x2="${x(d)}" y1="${mt + ih}" y2="${mt + ih + 4}" stroke="#94a3b8"/>` +
         `<text x="${x(d)}" y="${mt + ih + 16}" text-anchor="middle" fill="#64748b" font-size="11">${d}</text>`;
  g += `<text x="${ml + iw / 2}" y="${H - 3}" text-anchor="middle" fill="#64748b" font-size="11.5">${TXT.xDay}</text>`;
  g += `<rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="none" stroke="#cbd5e1"/>`;
  g += `<line x1="${ml}" x2="${W - mr}" y1="${y(IMt)}" y2="${y(IMt)}" stroke="#2563eb" stroke-dasharray="5 4" stroke-width="1.4"/>` +
       `<line x1="${ml}" x2="${W - mr}" y1="${y(MMt)}" y2="${y(MMt)}" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.4"/>`;
  const seen = rows.slice(0, shown + 1);
  // balance: the settlement move to the pre-call balance, then the top-up as a vertical green jump
  const path = seen.flatMap(r => r.d === 0 ? [[x(0), y(r.post)]] : r.call > 0 ? [[x(r.d), y(r.pre)], [x(r.d), y(r.post)]] : [[x(r.d), y(r.post)]]);
  g += `<polyline points="${path.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#1e3a8a" stroke-width="2"/>`;
  // the dashed price line sits on top: for one contract with no calls the two lines coincide
  g += `<polyline points="${seen.map(r => `${x(r.d).toFixed(1)},${yp(r.F).toFixed(1)}`).join(" ")}" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 3"/>`;
  for (const r of seen) {
    if (r.call > 0) {
      const cx = x(r.d), top = Math.max(y(r.post), mt + 26);
      g += `<line x1="${cx}" x2="${cx}" y1="${y(r.pre)}" y2="${y(r.post)}" stroke="#15803d" stroke-width="2.6"/>` +
           `<polygon points="${cx},${y(r.post) - 7} ${cx - 5},${y(r.post) + 2} ${cx + 5},${y(r.post) + 2}" fill="#15803d"/>` +
           `<text x="${Math.min(Math.max(cx, ml + textW(num(r.call)) / 2 + 4), W - mr - textW(num(r.call)) / 2 - 4)}" y="${top - 12}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d" stroke="#fff" stroke-width="3" paint-order="stroke">+${num(r.call)}</text>`;
    }
    g += `<circle cx="${x(r.d)}" cy="${y(r.post)}" r="${r.d === shown ? 4.5 : 2.8}" fill="#1e3a8a" stroke="#fff" stroke-width="1"/>`;
  }
  g += `<g font-size="11.5" fill="#334155">${legend}</g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${TXT.tabs[0]}">${g}</svg>`;
}

// The table keeps its price inputs between renders (so Tab moves on from one price to the next);
// only the computed cells are rewritten.
function buildTable() {
  const head = `<tr>${TXT.cols.map((c, i) => `<th title="${TXT.colTips[i]}">${c}</th>`).join("")}</tr>`;
  const body = S.rows.map(r => `<tr><td>${r.d}</td><td>` +
    (r.d ? `<input class="px" type="number" step="any" data-d="${r.d}" aria-label="${TXT.cols[1]} ${r.d}">` : "") +
    `</td><td></td><td></td><td></td><td></td><td></td></tr>`).join("");
  $("view").innerHTML = `<table class="detail"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function fillTable(follow) {
  const view = $("view"), tr = view.querySelector("tbody").rows;
  for (const el of view.querySelectorAll(".px"))
    if (el !== document.activeElement) el.value = prices[el.dataset.d - 1].toFixed(2);
  S.rows.forEach((r, d) => {
    const c = tr[d].cells, on = d <= shown, set = (i, text, cls = "") => { c[i].textContent = text; c[i].className = cls; };
    tr[d].className = (d > shown ? "future" : d === shown ? "cur" : "");
    if (d === 0) { set(1, fmt(P.F0, 2)); set(4, num(r.post)); return; }
    set(2, on ? paren(r.gain) : "", on && r.gain < 0 ? "neg" : "");
    set(3, on ? paren(r.cum) : "", on && r.cum < 0 ? "neg" : "");
    set(4, on ? num(r.pre) : "", on && r.call > 0 ? "low" : "");
    set(5, on && r.call > 0 ? num(r.call) : "", "dep");
    set(6, on && r.avail > 0 ? num(r.avail) : "");
  });
  if (!follow) return;
  const a = tr[shown].getBoundingClientRect(), v = view.getBoundingClientRect(), headH = view.querySelector("th").offsetHeight;
  if (a.top < v.top + headH) view.scrollTop -= v.top + headH - a.top;
  else if (a.bottom > v.bottom) view.scrollTop += a.bottom - v.bottom;
}

function sidePanel() {
  const { rows, IMt, MMt, mult } = S, r = rows[shown], f0 = fmt(P.F0, 2);
  const status = shown === 0 ? TXT.open(money(IMt), f0)
    : r.call > 0 ? TXT.call(money(r.pre), money(MMt), money(r.call), money(IMt)) : TXT.fine(money(r.pre), money(MMt));
  const kv = (label, value, cls = "") => `<div class="kv"><span>${label}</span><b class="${cls}">${value}</b></div>`;
  const total = clean((r.F - P.F0) * mult);                  // total gain from the formula, not from the daily rows
  const gainEq = `(${fmt(r.F, 2)} − ${f0}) × ${fmt(P.size)} × ${fmt(P.N)}${pos < 0 ? TXT.shortSign : ""} = <b class="${total < 0 ? "neg" : ""}">${money(total)}</b>`;
  const balEq = `${num(IMt)} + ${total < 0 ? `(${num(total)})` : num(total)} + ${num(r.dep)} = <b>${money(clean(IMt + total + r.dep))}</b>`;
  return `<h3>${TXT.head(shown)}</h3><div class="big${r.call > 0 ? " call" : ""}">${status}</div>` +
    kv(TXT.rows[0], money(r.gain), r.gain < 0 ? "neg" : "") + kv(TXT.rows[1], money(r.cum), r.cum < 0 ? "neg" : "") +
    kv(TXT.rows[2], money(r.pre)) + kv(TXT.rows[3], money(r.call), r.call > 0 ? "dep" : "") +
    kv(TXT.rows[4], money(r.post)) + kv(TXT.rows[5], money(r.avail)) +
    `<h3>${TXT.sumHead(shown)}</h3>` + kv(TXT.deposits(r.calls), money(r.dep), r.dep > 0 ? "dep" : "") +
    `<div class="eq">${TXT.gainEq}${pos < 0 ? TXT.shortSign : ""}<div>${gainEq}</div></div>` +
    `<div class="eq">${TXT.balEq}<div>${balEq}</div></div>`;
}

// ---------------------------------------------------------------- wiring
function mkSeg(id, labels) {
  $(id).innerHTML = labels.map((l, i) => `<button type="button" data-i="${i}">${l}</button>`).join("");
}
const markSeg = (id, cur) => [...$(id).children].forEach((b, i) => b.classList.toggle("on", i === cur));
mkSeg("pos", TXT.pos);
mkSeg("presets", TXT.presets);
mkSeg("tabs", TXT.tabs);
$("steps").innerHTML = TXT.steps.map((l, i) => `<button type="button" class="btn${i === 1 ? "" : " ghost"}" data-i="${i}">${l}</button>`).join("");
$("title").textContent = TXT.title;
$("presetLabel").textContent = TXT.presetLabel;
$("random").textContent = TXT.random;
$("hint").textContent = TXT.hint;

function render(follow = false) {
  S = simulate();
  $("nvline").innerHTML = TXT.top(money(P.F0 * P.size * P.N), money(S.IMt), money(S.MMt));
  markSeg("pos", pos > 0 ? 0 : 1);
  markSeg("presets", PRESET_KEYS.indexOf(preset));
  markSeg("tabs", tab);
  const [back, next, all, reset] = $("steps").children;
  back.disabled = reset.disabled = shown === 0;
  next.disabled = all.disabled = shown === P.n;
  if (tab === 0) { fitCharts(); $("view").innerHTML = chart(); }
  else {
    const tbody = $("view").querySelector("tbody");
    if (!tbody || tbody.rows.length !== P.n + 1) buildTable();
    fillTable(follow);
  }
  $("side").innerHTML = sidePanel();
}
$("pos").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { pos = b.dataset.i === "0" ? 1 : -1; preset = null; render(); } });
$("presets").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { applyPreset(PRESET_KEYS[b.dataset.i]); render(); } });
$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = +b.dataset.i; $("view").innerHTML = ""; render(true); } });
$("random").addEventListener("click", () => { randomPath(); render(); });
$("steps").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  shown = [Math.max(shown - 1, 0), Math.min(shown + 1, P.n), P.n, 0][b.dataset.i];
  render(true);
});
$("inputs").addEventListener("change", () => {
  const p = readParams();
  if (!p) return;
  applyParams(p); preset = null; render();
});
$("view").addEventListener("change", e => {
  const el = e.target.closest(".px");
  if (!el) return;
  const x = el.valueAsNumber, bad = !(x > 0);
  el.classList.toggle("bad", bad);
  if (bad) return;
  prices[el.dataset.d - 1] = x; el.value = x.toFixed(2); preset = null; render();
});
let resizeQueued = false;
addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; render(); });
});
applyPreset(PRESETS[params.get("preset")] ? params.get("preset") : "gold");
render();
</script>
</body>
</html>

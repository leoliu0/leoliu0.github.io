<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期权策略构建器</title>
<!-- Lecture 6 app: pick one of the lecture's strategies or build your own from calls, puts and
     stock; shows profit and payoff at expiry, break-evens, max profit/loss, and optionally the
     Black-Scholes value before expiry. Add ?lang=en for English, ?preset=<id> to open a preset. -->
<link rel="stylesheet" href="assets/fonts/kai.css">
<style>
  :root {
    --navy: #1e3a8a; --accent: #2563eb; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --surface: #f8fafc; --gain: #15803d; --loss: #dc2626; --amber: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body { font-family: "FandolKai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1.35; }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 1100px; height: 100vh; margin: 0 auto; padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 7px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 17px; color: var(--navy); }
  .pick { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); }
  select, .cell, .field input { border: 1px solid #cbd5e1; border-radius: 5px; background: #fff; color: var(--ink); }
  select { padding: 3px 6px; max-width: 100%; }
  .controls { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
  .field { display: flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
  .field input[type=number] { width: 66px; padding: 2px 6px; }
  .field input.bad, .cell.bad { border-color: var(--loss); background: #fef2f2; }
  .field input[type=checkbox] { accent-color: var(--accent); }
  .main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 252px; grid-template-rows: minmax(0, 1fr); gap: 10px; }
  .left { display: flex; flex-direction: column; gap: 7px; min-height: 0; min-width: 0; }
  .panel { border: 1px solid var(--line); border-radius: 8px; background: #fff; min-width: 0; }
  .chart { flex: 1 1 0; min-height: 150px; display: flex; }
  .view { flex: 1; min-width: 0; position: relative; }
  .view svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .view svg text { font-family: inherit; }
  .legs { flex: 0 0 auto; padding: 4px 8px 6px; }
  .legs-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .legs-head h3, .side h3 { margin: 0; font-size: 13.5px; color: var(--navy); }
  .btn { border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 6px; padding: 1px 10px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #eff6ff; }
  /* overflow-x hidden: sub-pixel rounding made the legs table 1px wider and showed a scrollbar */
  .legs-scroll { max-height: 40vh; overflow-y: auto; overflow-x: hidden; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 1px 3px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; border-bottom: 1px solid var(--line); }
  .legs table { table-layout: fixed; }
  .legs th, .legs td { text-align: center; }
  .cell { width: 100%; padding: 1px 4px; font-size: 12.5px; text-align: right; -moz-appearance: textfield; }
  .cell::-webkit-inner-spin-button, .cell::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .cell:disabled { background: var(--surface); color: #94a3b8; }
  select.cell { text-align: left; padding: 1px 2px; }
  .sd { width: 100%; border: 1px solid; border-radius: 5px; background: #fff; padding: 1px 4px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .sd.long { color: var(--gain); border-color: var(--gain); }
  .sd.short { color: var(--loss); border-color: var(--loss); }
  .x { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 3px; }
  .x:hover { color: var(--loss); }
  .empty { margin: 6px 2px; color: var(--muted); }
  .side { padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: auto; }
  .note { margin: 0 0 3px; font-size: 12px; color: var(--muted); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .kv span { color: var(--muted); }
  .kv b { font-variant-numeric: tabular-nums; text-align: right; }
  .big { margin: 3px 0; padding: 4px 8px; border-radius: 6px; background: #eff6ff; color: var(--navy); }
  .big .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big small { color: var(--muted); }
  .pl { margin-top: 5px; font-size: 12.5px; }
  .pl th:first-child, .pl td:first-child { text-align: left; }
  .pl tr.s0 td { color: var(--navy); font-weight: 600; }
  .pl td { border-bottom: 1px solid #f1f5f9; }
  .pos { color: var(--gain); }
  .neg { color: var(--loss); }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 700px) {
    .app { height: auto; }
    .main { flex: none; display: flex; flex-direction: column; }
    .left { flex: none; }
    .chart { flex: none; }
    .view { height: min(78vw, 420px); flex: none; width: 100%; }
    .legs-scroll { max-height: none; overflow-x: auto; }
    .side { overflow: visible; }
    .pick { margin-left: 0; }
  }
</style>
</head>

// ---------------------------------------------------------------- the market and presets

// ---------------------------------------------------------------- maths
function ncdf(x) {                  // Abramowitz & Stegun 26.2.17, error < 1e-7
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const p = 0.3989422804014327 * Math.exp(-x * x / 2) *
    t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  return x > 0 ? 1 - p : p;
}
// Black-Scholes value of a call or put, r = 0, no dividends; tau in years.
function bs(S, K, tau, sigma, isCall) {
  if (tau <= 1e-9) return Math.max(isCall ? S - K : K - S, 0);
  S = Math.max(S, 1e-9);
  const v = sigma * Math.sqrt(tau), d1 = (Math.log(S / K) + v * v / 2) / v;
  const call = S * ncdf(d1) - K * ncdf(d1 - v);
  return isCall ? call : call - S + K;
}

const round2 = x => Math.round(x * 100) / 100;
let S = { preset: "", market: MARKET, S0: MARKET.S0, sigma: SIGMA, T: 12, bsOn: false, legs: [] };

const quote = l => S.market[l.type] && S.market[l.type][l.K];
// Default premium: the market quote at the market's expiry, otherwise Black-Scholes at sigma.
function defaultPrem(l) {
  if (l.type === "stock") return S.S0;
  const q = quote(l);
  return q !== undefined && l.exp === S.market.life ? q : round2(bs(S.S0, l.K, l.exp / 12, S.sigma, l.type === "call"));
}
function makeLeg(spec) {
  const l = { side: spec.side, type: spec.type, K: spec.K ?? nearestStrike(), qty: spec.qty, exp: spec.exp ?? S.market.life };
  l.prem = spec.prem ?? defaultPrem(l);
  l.auto = l.prem === defaultPrem(l);
  return l;
}
function nearestStrike() {
  const ks = Object.keys({ ...S.market.call, ...S.market.put }).map(Number);
  return ks.reduce((a, b) => Math.abs(b - S.S0) < Math.abs(a - S.S0) ? b : a);
}
const optionLegs = () => S.legs.filter(l => l.type !== "stock");
const horizon = () => optionLegs().reduce((h, l) => Math.min(h, l.exp), Infinity);   // months to the first expiry

function loadPreset(id) {
  const p = PRESETS.find(x => x.id === id);
  S.preset = id;
  S.market = MARKET;
  S.S0 = MARKET.S0;
  S.sigma = SIGMA;
  S.legs = p.legs.map(makeLeg);
  S.T = Number.isFinite(horizon()) ? horizon() : MARKET.life;
}

// Value of one unit of a leg when T months remain until the first expiry (T = 0: at that expiry).
function legValue(l, s, T) {
  if (l.type === "stock") return s;
  return bs(s, l.K, (l.exp - horizon() + T) / 12, S.sigma, l.type === "call");
}
const profit = (s, T) => S.legs.reduce((a, l) => a + l.side * l.qty * (legValue(l, s, T) - l.prem), 0);
const payoff = s => S.legs.reduce((a, l) => a + l.side * l.qty * legValue(l, s, 0), 0);

// Break-evens, max profit and max loss at the first expiry. Strategies of one expiry are piecewise
// linear, so the kinks (S = 0 and the strikes) decide everything; with a second expiry the far
// options are curved and a fine grid is scanned instead (results approximate).
function analyse() {
  const legs = S.legs, H = horizon();
  const strikes = [...new Set(optionLegs().map(l => l.K))].sort((a, b) => a - b);
  const exact = legs.every(l => l.type === "stock" || l.exp === H);
  const slope = legs.reduce((a, l) => a + (l.type === "put" ? 0 : l.side * l.qty), 0);   // d profit / d S as S -> infinity
  let pts = [0, ...strikes];
  if (!exact) {
    const top = 3 * Math.max(S.S0, ...strikes);
    for (let i = 1; i <= 600; i++) pts.push(top * i / 600);
    pts = [...new Set(pts)].sort((a, b) => a - b);
  }
  const P = pts.map(s => profit(s, 0));
  const sign = v => Math.abs(v) < 1e-9 ? 0 : Math.sign(v);
  const be = [];
  for (let i = 1; i < pts.length; i++) {
    const a = sign(P[i - 1]), b = sign(P[i]);
    if (a !== 0 && b === 0) be.push(pts[i]);
    else if (a * b < 0) {
      let lo = pts[i - 1], hi = pts[i];
      for (let k = 0; k < 50; k++) { const mid = (lo + hi) / 2; if (sign(profit(mid, 0)) === a) lo = mid; else hi = mid; }
      be.push((lo + hi) / 2);
    }
  }
  const last = pts.length - 1;
  if (sign(P[last]) * Math.sign(slope) < 0) be.push(pts[last] - P[last] / slope);
  return {
    exact, be, strikes,
    maxP: slope > 0 ? Infinity : Math.max(...P),
    maxL: slope < 0 ? -Infinity : Math.min(...P),
    net: -legs.reduce((a, l) => a + l.side * l.qty * l.prem, 0),
    bsNet: -legs.reduce((a, l) => a + l.side * l.qty * legValue(l, S.S0, H), 0),
  };
}

// ---------------------------------------------------------------- formatting
const fmt = x => { const r = Math.round(x * 100) / 100; return (r < 0 ? "−" : "") + Math.abs(r).toLocaleString("en-US", { maximumFractionDigits: 2 }); };
const money = x => { const t = fmt(x); return t[0] === "−" ? "−$" + t.slice(1) : "$" + t; };
const signed = x => (Math.round(x * 100) > 0 ? "+" : "") + money(x);
const cls = x => Math.round(x * 100) > 0 ? "pos" : Math.round(x * 100) < 0 ? "neg" : "";
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map(k => k * mag).find(k => k >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return { ticks: out, dp: Math.max(0, -Math.floor(Math.log10(step) + 1e-9)) };
}

// ---------------------------------------------------------------- chart
// Drawn at the panel's own pixel size, so text stays 11-12 px however wide the frame is.
let W = 420, H = 300, plot = null;
const textW = s => [...s].reduce((w, c) => w + (/[\u2e80-\u9fff\uff00-\uffef]/.test(c) ? 11.5 : 6.2), 0);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const halo = ' stroke="#fff" stroke-width="3" paint-order="stroke"';

function chartSvg(a) {
  const near = !a.exact;
  const items = [["#1e3a8a", "", 2.6, near ? `${TXT.near}: ${TXT.legend.profit}` : TXT.legend.profit],
                 ["#d97706", ' stroke-dasharray="6 4"', 1.6, near ? `${TXT.near}: ${TXT.legend.payoff}` : TXT.legend.payoff]];
  if (S.bsOn) items.push(["#2563eb", "", 1.6, TXT.legend.bs(+S.T.toFixed(2))]);
  const ml = 44, mr = 12, mb = 46;
  let lx = ml, ly = 10, legend = "";
  for (const [color, dash, wid, label] of items) {
    const w = 24 + textW(label);
    if (lx > ml && lx + w > W - 4) { lx = ml; ly += 16; }
    legend += `<line x1="${lx}" x2="${lx + 20}" y1="${ly}" y2="${ly}" stroke="${color}" stroke-width="${wid}"${dash}/><text x="${lx + 24}" y="${ly + 4}">${esc(label)}</text>`;
    lx += w + 14;
  }
  const mt = ly + 14, iw = W - ml - mr, ih = H - mt - mb;

  const marks = [S.S0, ...a.strikes, ...a.be];
  const lo0 = Math.min(...marks), hi0 = Math.max(...marks), pad = Math.max(0.5 * (hi0 - lo0), 0.15 * S.S0);
  const lo = Math.max(0, lo0 - pad), hi = hi0 + pad;
  const xs = [...new Set([lo, hi, ...Array.from({ length: 201 }, (_, i) => lo + (hi - lo) * i / 200),
                          ...[...a.strikes, ...a.be].filter(v => v > lo && v < hi)])].sort((p, q) => p - q);
  const prof = xs.map(s => profit(s, 0)), pay = xs.map(payoff), pre = S.bsOn ? xs.map(s => profit(s, S.T)) : [];
  const all = [0, ...prof, ...pay, ...pre];
  let ylo = Math.min(...all), yhi = Math.max(...all);
  if (yhi - ylo < 1e-9) { ylo -= 1; yhi += 1; }
  const ypad = 0.08 * (yhi - ylo);
  ylo -= ypad; yhi += ypad;
  const x = v => ml + iw * (v - lo) / (hi - lo), y = v => mt + ih * (yhi - v) / (yhi - ylo), y0 = y(0);
  plot = { ml, mt, iw, ih, lo, hi, x, y };
  const path = ys => xs.map((s, i) => `${x(s).toFixed(1)},${y(ys[i]).toFixed(1)}`).join(" ");

  let g = "";
  const yt = niceTicks(ylo, yhi, Math.max(3, Math.round(ih / 45)));
  for (const t of yt.ticks)
    g += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" stroke="#eef2f7"/>` +
         `<text x="${ml - 6}" y="${y(t) + 4}" text-anchor="end" fill="#64748b" font-size="11">${fmt(t)}</text>`;
  const xt = niceTicks(lo, hi, Math.max(3, Math.round(iw / 70)));
  for (const t of xt.ticks)
    g += `<line x1="${x(t)}" x2="${x(t)}" y1="${mt + ih}" y2="${mt + ih + 4}" stroke="#94a3b8"/>` +
         `<text x="${x(t)}" y="${mt + ih + 16}" text-anchor="middle" fill="#64748b" font-size="11">${t.toFixed(xt.dp)}</text>`;
  g += `<text x="${ml + iw / 2}" y="${H - 4}" text-anchor="middle" fill="#64748b" font-size="11.5">${TXT.xAxis}</text>`;
  g += `<rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="none" stroke="#cbd5e1"/>`;
  g += `<clipPath id="up"><rect x="${ml}" y="${mt}" width="${iw}" height="${Math.max(0, y0 - mt)}"/></clipPath>` +
       `<clipPath id="dn"><rect x="${ml}" y="${y0}" width="${iw}" height="${Math.max(0, mt + ih - y0)}"/></clipPath>`;
  const area = `${x(xs[0])},${y0} ${path(prof)} ${x(xs[xs.length - 1])},${y0}`;
  g += `<polygon points="${area}" fill="#15803d" opacity="0.13" clip-path="url(#up)"/>` +
       `<polygon points="${area}" fill="#dc2626" opacity="0.12" clip-path="url(#dn)"/>`;
  g += `<line x1="${ml}" x2="${W - mr}" y1="${y0}" y2="${y0}" stroke="#0f172a"/>`;
  // strikes: dotted verticals with the value at the top; neighbours alternate rows so labels stay apart
  a.strikes.forEach((k, i) => {
    g += `<line x1="${x(k)}" x2="${x(k)}" y1="${mt}" y2="${mt + ih}" stroke="#1e3a8a" stroke-dasharray="2 3" opacity="0.55"/>` +
         `<text x="${x(k)}" y="${mt + 11 + (i % 2) * 12}" text-anchor="middle" font-size="11" fill="#1e3a8a"${halo}>K=${fmt(k)}</text>`;
  });
  g += `<polyline points="${path(pay)}" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  if (S.bsOn) g += `<polyline points="${path(pre)}" fill="none" stroke="#2563eb" stroke-width="1.6"/>`;
  g += `<polyline points="${path(prof)}" fill="none" stroke="#1e3a8a" stroke-width="2.6" stroke-linejoin="round"/>`;
  for (const b of a.be)
    g += `<circle cx="${x(b)}" cy="${y0}" r="4" fill="#fff" stroke="#0f172a" stroke-width="1.6"/>` +
         `<text x="${x(b)}" y="${y0 + 16}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a"${halo}>${fmt(b)}</text>`;
  g += `<path d="M${x(S.S0)} ${mt + ih + 1} l-4 6 h8 z" fill="#64748b"/>` +
       `<text x="${x(S.S0)}" y="${mt + ih + 29}" text-anchor="middle" font-size="11" fill="#475569">S₀</text>`;
  g += `<g font-size="11.5" fill="#334155">${legend}</g>`;
  g += `<g id="hov" display="none" pointer-events="none"><line id="hovLine" y1="${mt}" y2="${mt + ih}" stroke="#64748b"/>` +
       `<circle id="hovDot" r="4" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>` +
       `<text id="hovText" y="${mt + ih - 8}" font-size="11.5" fill="#0f172a"${halo}></text></g>` +
       `<rect id="hit" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent" style="touch-action: pan-y"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(TXT.names[S.preset] || TXT.names.custom)}">${g}</svg>`;
}

function wireHover() {
  const hit = $("hit"), hov = $("hov");
  if (!hit) return;
  const move = e => {
    const r = hit.getBoundingClientRect(), px = (e.clientX - r.left) * (plot.iw / r.width);
    const s = plot.lo + (plot.hi - plot.lo) * Math.min(Math.max(px / plot.iw, 0), 1);
    const p = profit(s, 0), xx = plot.x(s), right = xx < plot.ml + plot.iw / 2;
    $("hovLine").setAttribute("x1", xx); $("hovLine").setAttribute("x2", xx);
    $("hovDot").setAttribute("cx", xx); $("hovDot").setAttribute("cy", plot.y(p));
    const t = $("hovText");
    t.textContent = TXT.hover(fmt(s), signed(p), signed(payoff(s)));
    t.setAttribute("x", right ? plot.ml + plot.iw - 6 : plot.ml + 6);
    t.setAttribute("text-anchor", right ? "end" : "start");
    hov.removeAttribute("display");
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => hov.setAttribute("display", "none"));
}

// ---------------------------------------------------------------- side panel
function sidePanel(a) {
  const name = TXT.names[S.preset], flow = a.net >= 0 ? TXT.in : TXT.out, ap = a.exact ? "" : TXT.approx;
  const lim = v => Number.isFinite(v) ? `<b class="${cls(v)}">${ap}${signed(v)}</b>` : `<b>${TXT.unlimited}</b>`;
  let h = `<h3>${esc(name)}</h3><p class="note">${esc(TXT.notes[S.preset])}</p>`;
  if (!S.legs.length) return h;
  h += `<div class="big"><small>${TXT.res.net}</small><br><span class="v ${cls(a.net)}">${signed(a.net)}</span> <small>${flow}</small></div>`;
  h += `<div class="kv"><span>${TXT.res.maxP}</span>${lim(a.maxP)}</div>`;
  h += `<div class="kv"><span>${TXT.res.maxL}</span>${lim(a.maxL)}</div>`;
  h += `<div class="kv"><span>${TXT.res.be}</span><b>${a.be.length ? ap + a.be.map(b => "$" + fmt(b)).join(LANG === "en" ? ", " : "、") : TXT.none}</b></div>`;
  if (S.bsOn) h += `<div class="kv"><span>${TXT.res.bs0}</span><b class="${cls(a.bsNet)}">${signed(a.bsNet)}</b></div>`;
  const prices = [...new Set([0.8 * S.S0, S.S0, 1.2 * S.S0, ...a.strikes].map(round2))].sort((p, q) => p - q);
  const rows = prices.map(s => {
    const p = profit(s, 0), q = S.bsOn ? profit(s, S.T) : null;
    return `<tr${s === round2(S.S0) ? ' class="s0"' : ""}><td>${fmt(s)}</td><td class="${cls(p)}">${signed(p)}</td>` +
           (S.bsOn ? `<td class="${cls(q)}">${signed(q)}</td>` : "") + `</tr>`;
  }).join("");
  h += `<table class="pl"><thead><tr><th>${TXT.table[0]}</th><th>${TXT.table[1]}</th>${S.bsOn ? `<th>${TXT.table[2]}</th>` : ""}</tr></thead><tbody>${rows}</tbody></table>`;
  return h;
}

// ---------------------------------------------------------------- legs table
function legRow(l, i) {
  const stock = l.type === "stock";
  const opt = t => `<option value="${t}"${l.type === t ? " selected" : ""}>${TXT.types[t]}</option>`;
  const cell = (f, v, step, off) =>
    `<input class="cell" data-f="${f}" type="number" step="${step}" value="${off ? "" : v}"${off ? ' disabled placeholder="—"' : ""}>`;
  return `<tr data-i="${i}"><td><button type="button" class="sd ${l.side > 0 ? "long" : "short"}" data-act="side">${TXT.sides[l.side > 0 ? 0 : 1]}</button></td>` +
    `<td><select class="cell" data-f="type">${opt("call")}${opt("put")}${opt("stock")}</select></td>` +
    `<td>${cell("K", l.K, "any", stock)}</td><td>${cell("qty", l.qty, 1)}</td>` +
    `<td>${cell("prem", l.prem, 0.01)}</td><td>${cell("exp", l.exp, 0.5, stock)}</td>` +
    `<td><button type="button" class="x" data-act="del" aria-label="${TXT.colTips[6]}">×</button></td></tr>`;
}
function renderLegs() {
  if (!S.legs.length) { $("legs").innerHTML = `<p class="empty">${TXT.empty}</p>`; return; }
  const head = TXT.cols.map((c, i) => `<th title="${TXT.colTips[i]}">${c}</th>`).join("");
  $("legs").innerHTML = `<table><colgroup><col style="width:15%"><col style="width:19%"><col style="width:17%"><col style="width:11%"><col style="width:17%"><col style="width:15%"><col style="width:6%"></colgroup><thead><tr>${head}</tr></thead><tbody>${S.legs.map(legRow).join("")}</tbody></table>`;
}
// Refresh the editable cells of one row in place (keeps keyboard focus where it is).
function syncRow(i) {
  const l = S.legs[i], tr = $("legs").querySelector(`tr[data-i="${i}"]`), stock = l.type === "stock";
  const set = (f, v, off) => {
    const el = tr.querySelector(`[data-f="${f}"]`);
    el.disabled = !!off; el.value = off ? "" : v; el.placeholder = off ? "—" : "";
    el.classList.remove("bad");
  };
  set("K", l.K, stock); set("qty", l.qty); set("prem", l.prem); set("exp", l.exp, stock);
}

// Parses one edited cell; null if invalid.
function parseCell(f, el) {
  const v = el.valueAsNumber;
  const ok = Number.isFinite(v) && (f === "prem" ? v >= 0 : v > 0) && (f !== "qty" || Number.isInteger(v));
  el.classList.toggle("bad", !ok);
  return ok ? v : null;
}
function toCustom() {
  S.preset = "custom";
  $("preset").value = "custom";
}
function onLegChange(e) {
  const tr = e.target.closest("tr[data-i]");
  if (!tr) return;
  const i = +tr.dataset.i, l = S.legs[i], f = e.target.dataset.f;
  if (f === "type") {
    l.type = e.target.value;
  } else {
    const v = parseCell(f, e.target);
    if (v === null) return;
    l[f] = v;
    if (f === "prem") l.auto = false;
  }
  if (l.auto && f !== "prem") l.prem = defaultPrem(l);
  toCustom();
  syncRow(i);
  S.T = Math.min(S.T, horizon());
  syncControls();
  renderResults();
}
function onLegClick(e) {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const i = +btn.closest("tr").dataset.i;
  toCustom();
  if (btn.dataset.act === "side") {
    const l = S.legs[i];
    l.side *= -1;
    btn.className = `sd ${l.side > 0 ? "long" : "short"}`;
    btn.textContent = TXT.sides[l.side > 0 ? 0 : 1];
  } else {
    S.legs.splice(i, 1);
    S.T = Math.min(S.T, horizon());
    renderLegs();
  }
  renderResults();
}

// ---------------------------------------------------------------- wiring
function syncControls() {
  $("f-S0").value = +S.S0.toFixed(4);
  $("f-bs").checked = S.bsOn;
  $("f-sigma").value = +(S.sigma * 100).toFixed(1);
  $("f-T").value = +S.T.toFixed(2);
  for (const id of ["f-S0", "f-sigma", "f-T"]) $(id).classList.remove("bad");
}
function renderResults() {
  const view = $("view");
  W = Math.max(300, view.clientWidth);
  H = Math.max(180, view.clientHeight);
  const a = analyse();
  view.innerHTML = chartSvg(a);
  wireHover();
  $("side").innerHTML = sidePanel(a);
}
function render() {
  $("preset").value = S.preset;
  syncControls();
  renderLegs();
  renderResults();
}

$("title").textContent = TXT.title;
$("presetLabel").textContent = TXT.presetLabel;
$("lblS0").textContent = TXT.lblS0;
$("lblBs").textContent = TXT.lblBs;
$("lblSigma").textContent = TXT.lblSigma;
$("lblT").textContent = TXT.lblT;
$("legsTitle").textContent = TXT.legsTitle;
$("add").textContent = TXT.add;
$("hint").textContent = TXT.hint;
$("preset").innerHTML = TXT.groups.map((g, gi) =>
  `<optgroup label="${esc(g)}">${PRESETS.filter(p => p.group === gi).map(p => `<option value="${p.id}">${esc(TXT.names[p.id])}</option>`).join("")}</optgroup>`).join("");

$("preset").addEventListener("change", e => { loadPreset(e.target.value); render(); });
$("add").addEventListener("click", () => {
  S.legs.push(makeLeg({ side: 1, type: "call", qty: 1 }));
  toCustom();
  renderLegs();
  renderResults();
});
$("legs").addEventListener("change", onLegChange);
$("legs").addEventListener("click", onLegClick);
$("f-bs").addEventListener("change", e => { S.bsOn = e.target.checked; renderResults(); });
for (const [id, key] of [["f-S0", "S0"], ["f-sigma", "sigma"], ["f-T", "T"]]) {
  $(id).addEventListener("change", e => {
    const v = e.target.valueAsNumber, ok = Number.isFinite(v) && v > 0 && (key !== "sigma" || v <= 300);
    e.target.classList.toggle("bad", !ok);
    if (!ok) return;
    S[key] = key === "sigma" ? v / 100 : v;
    if (key === "S0") S.legs.forEach((l, i) => { if (l.auto) { l.prem = defaultPrem(l); syncRow(i); } });
    renderResults();
  });
}
let resizeQueued = false;
addEventListener("resize", () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; renderResults(); });
});
const wanted = new URLSearchParams(location.search).get("preset");
loadPreset(PRESETS.some(p => p.id === wanted) ? wanted : "cc");
render();
</script>
</body>
</html>
